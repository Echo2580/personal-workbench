 === 'done' || t.done === true; }\n    if (t.done) { return false; }\n    if (tab === 'today') { return t.scope === 'today'; }\n    return t.scope === 'soon';\n  });\n}\n\n/* 首页只挑最要紧的：未完成 + 优先重点 + 逾期优先，最多 3 件 */\nfunction importantTasks() {\n  const pending = TASKS.filter(function (t) { return !t.done; });\n  const rank = { high:0, medium:1, low:2 };\n  return pending.slice().sort(function (a, b) {\n    const ao = a.overdue ? 0 : 1, bo = b.overdue ? 0 : 1;\n    if (ao !== bo) { return ao - bo; }\n    const ak = a.key ? 0 : 1, bk = b.key ? 0 : 1;\n    if (ak !== bk) { return ak - bk; }\n    return rank[a.priority] - rank[b.priority];\n  }).slice(0, 3);\n}\n\nfunction taskRowHTML(t) {\n  const p = PRIORITY[t.priority] || PRIORITY.low;\n  const meta = [];\n  meta.push('&lt;span class=\&quot;inline-flex items-center gap-1.5 ' + (t.overdue ? 'text-[#d05a4e]' : '') + '\&quot;&gt;' + t.dueLabel + '&lt;/span&gt;');\n  if (t.project &amp;&amp; t.project !== '不关联') { meta.push('&lt;span&gt;' + t.project + '&lt;/span&gt;'); }\n\n  const actionBtn = 'w-7 h-7 rounded-full text-[#a5a19b] hover:bg-[#eff2f0] hover:text-[#2f7d74] flex items-center justify-center transition-colors';\n  const actions = '&lt;button onclick=\&quot;postponeTask(\\'' + t.id + '\\', event)\&quot; title=\&quot;延期到明天\&quot; class=\&quot;' + actionBtn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:calendar-plus\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n    + '&lt;button onclick=\&quot;openTask(\\'' + t.id + '\\')\&quot; title=\&quot;查看详情\&quot; class=\&quot;' + actionBtn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:arrow-right\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;';\n\n  return ''\n    + '&lt;div class=\&quot;group flex items-start gap-3 px-3 py-3 rounded-[14px] hover:bg-white transition-colors\&quot;&gt;'\n    +   '&lt;button type=\&quot;button\&quot; onclick=\&quot;toggleTask(\\'' + t.id + '\\', event)\&quot; title=\&quot;标记为已完成\&quot; class=\&quot;mt-[3px] w-[17px] h-[17px] rounded-full border border-[#cfc9c0] hover:border-[#2f7d74] flex items-center justify-center shrink-0 transition-colors\&quot;&gt;'\n    +     '&lt;iconify-icon icon=\&quot;ph:check-bold\&quot; class=\&quot;text-[10px] text-white hidden\&quot;&gt;&lt;/iconify-icon&gt;'\n    +   '&lt;/button&gt;'\n    +   '&lt;div class=\&quot;min-w-0 flex-1\&quot;&gt;'\n    +     '&lt;p onclick=\&quot;openTask(\\'' + t.id + '\\')\&quot; class=\&quot;text-[14px] leading-[21px] text-[#23282c] hover:text-[#2f7d74] cursor-pointer transition-colors truncate\&quot;&gt;' + t.title + '&lt;/p&gt;'\n    +     '&lt;div class=\&quot;mt-1 flex flex-wrap items-center gap-x-2.5 gap-y-1 text-[12px] text-[#9a968f]\&quot;&gt;'\n    +       '&lt;i class=\&quot;w-1.5 h-1.5 rounded-full\&quot; style=\&quot;background:' + p.dot + '\&quot;&gt;&lt;/i&gt;' + meta.join('')\n    +       (t.key ? '&lt;span class=\&quot;text-[#a86b28]\&quot;&gt;重点&lt;/span&gt;' : '')\n    +       (t.overdue ? '&lt;span class=\&quot;text-[#c4473e]\&quot;&gt;逾期&lt;/span&gt;' : '')\n    +     '&lt;/div&gt;'\n    +   '&lt;/div&gt;'\n    +   '&lt;div class=\&quot;flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity\&quot;&gt;' + actions + '&lt;/div&gt;'\n    + '&lt;/div&gt;';\n}\n\nfunction renderTasks() {\n  const list = document.getElementById('task-list');\n  let html = '';\n  const pendingToday = TASKS.filter(function (t) { return t.scope === 'today' &amp;&amp; !t.done; });\n\n  if (pendingToday.length === 0) {\n    html += ''\n      + '&lt;div class=\&quot;flex items-center gap-3 mx-1 my-1 px-3.5 py-3 rounded-[14px] bg-[#eff6f3]\&quot;&gt;'\n      +   '&lt;iconify-icon icon=\&quot;ph:check-circle\&quot; class=\&quot;text-[18px] text-[#2f7d74]\&quot;&gt;&lt;/iconify-icon&gt;'\n      +   '&lt;p class=\&quot;text-[12.5px] text-[#2f6b63]\&quot;&gt;今天的待办都完成了，共 ' + TASKS.filter(function (t) { return t.done; }).length + ' 项。&lt;/p&gt;'\n      +   '&lt;button onclick=\&quot;undoAllDone()\&quot; class=\&quot;ml-auto text-[12px] text-[#2f7d74] hover:underline\&quot;&gt;撤销&lt;/button&gt;'\n      + '&lt;/div&gt;';\n  }\n\n  const items = importantTasks();\n  if (items.length === 0) {\n    html += ''\n      + '&lt;div class=\&quot;flex flex-col items-center justify-center py-8 text-center\&quot;&gt;'\n      +   '&lt;div class=\&quot;w-11 h-11 rounded-full bg-[#eff6f3] flex items-center justify-center\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:check-circle\&quot; class=\&quot;text-[22px] text-[#2f7d74]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/div&gt;'\n      +   '&lt;p class=\&quot;mt-2.5 text-[13px] text-[#5c5f63]\&quot;&gt;现在没有待办任务了&lt;/p&gt;'\n      +   '&lt;p class=\&quot;mt-1 text-[12px] text-[#a5a19b]\&quot;&gt;把想到的事记下来，稍后再安排。&lt;/p&gt;'\n      +   '&lt;button onclick=\&quot;openQuickAdd(\\'todo\\')\&quot; class=\&quot;mt-3 h-8 px-3 rounded-full bg-[#2f7d74] text-white text-[12.5px] hover:bg-[#286b63]\&quot;&gt;新增待办&lt;/button&gt;'\n      + '&lt;/div&gt;';\n  } else {\n    html += items.map(taskRowHTML).join('');\n  }\n  list.innerHTML = html;\n  updateStats();\n}\n\nfunction updateStats() {\n  const pending = TASKS.filter(function (t) { return t.scope === 'today' &amp;&amp; !t.done; }).length;\n  const doneToday = TASKS.filter(function (t) { return t.done; }).length;\n  const total = pending + doneToday;\n  const keyCount = TASKS.filter(function (t) { return t.key &amp;&amp; !t.done; }).length;\n  const soonCount = TASKS.filter(function (t) { return t.scope === 'soon' &amp;&amp; !t.done; }).length;\n  const calEvs = demoState.noSchedule ? [] : (EVENTS[TODAY] || []);\n\n  document.getElementById('task-sum').textContent = pending + ' 项待办 · ' + keyCount + ' 项重点';\n  document.getElementById('task-foot').textContent = doneToday + ' / ' + total + ' 项已处理';\n  document.getElementById('hd-carry').textContent = keyCount + ' 项重点待办 · ' + calEvs.length + ' 项安排';\n  document.getElementById('hero-summary').textContent = pending === 0\n    ? '今天的待办已经清空，接下来 ' + soonCount + ' 件事排在本周后面。'\n    : '今天有 ' + calEvs.length + ' 项安排、' + pending + ' 件待办，其中 ' + keyCount + ' 件是重点；先推进「' + (importantTasks()[0] ? importantTasks()[0].title : '今天的第一件事') + '」。';\n  const navBadge = document.querySelector('a[href=\&quot;todos.html\&quot;] span.ml-auto');\n  if (navBadge) { navBadge.textContent = pending; }\n}\n\nfunction toggleTask(id, ev) {\n  if (ev) { ev.stopPropagation(); }\n  const t = TASKS.find(function (x) { return x.id === id; });\n  if (!t) { return; }\n  if (t.done) { restoreTask(id); return; }\n  t.done = true;\n  t.doneAt = '刚刚';\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('已完成「' + t.title + '」', function () { restoreTask(id); });\n}\n\nfunction restoreTask(id, ev) {\n  if (ev) { ev.stopPropagation(); }\n  const t = TASKS.find(function (x) { return x.id === id; });\n  if (!t) { return; }\n  t.done = false;\n  delete t.doneAt;\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('已恢复「' + t.title + '」为未完成');\n}\n\nfunction postponeTask(id, ev) {\n  if (ev) { ev.stopPropagation(); }\n  const t = TASKS.find(function (x) { return x.id === id; });\n  if (!t) { return; }\n  const old = t.dueLabel;\n  t.dueLabel = '明天 20:00';\n  t.dueDate = '2026-10-17';\n  t.overdue = false;\n  delete t.doneAt;\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('「' + t.title + '」已延期到明天 20:00', function () { t.dueLabel = old; t.dueDate = '2026-10-16'; renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate); });\n}\n\nfunction undoAllDone() {\n  applyDemoState('allDone', false);\n  setSwitch(document.querySelector('[data-demo=\&quot;allDone\&quot;]'), false);\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 任务详情抽屉 ========== */\nfunction openTask(id) {\n  const t = TASKS.find(function (x) { return x.id === id; });\n  if (!t) { return; }\n  currentTaskId = id;\n  document.getElementById('td-title').value = t.title;\n  document.getElementById('td-desc').value = t.desc || '';\n  document.getElementById('td-priority').value = t.priority;\n  document.getElementById('td-project').value = t.project || '不关联';\n  const dueSel = document.getElementById('td-due');\n  const options = ['今天 18:00', '今天 20:00', '今天 21:30', '明天 20:00', '10 月 18 日 20:00', '10 月 20 日', '10 月 22 日'];\n  dueSel.innerHTML = options.map(function (o) { return '&lt;option' + (o === t.dueLabel ? ' selected' : '') + '&gt;' + o + '&lt;/option&gt;'; }).join('');\n  if (options.indexOf(t.dueLabel) === -1) { dueSel.innerHTML = '&lt;option selected&gt;' + t.dueLabel + '&lt;/option&gt;' + dueSel.innerHTML; }\n  document.getElementById('td-state').textContent = t.done ? '已完成 · 可恢复' : '原型示例 · 可编辑';\n  const check = document.getElementById('td-check');\n  const icon = document.getElementById('td-check-icon');\n  if (t.done) { check.classList.remove('border-[#cfd6d9]'); check.classList.add('bg-[#2f7d74]', 'border-[#2f7d74]'); icon.classList.remove('hidden'); }\n  else { check.classList.add('border-[#cfd6d9]'); check.classList.remove('bg-[#2f7d74]', 'border-[#2f7d74]'); icon.classList.add('hidden'); }\n  const keyBtn = document.getElementById('td-key');\n  keyBtn.textContent = t.key ? '已设为重点' : '设为重点';\n  keyBtn.className = 'h-7 px-2.5 rounded-full border text-[12px] ' + (t.key ? 'border-[#f0dcc0] bg-[#fbf1e6] text-[#a86b28]' : 'border-[#e7e2da] text-[#5c5f63] hover:border-[#2f7d74]');\n  renderSubs();\n  renderTdProject(t);\n  document.getElementById('task-drawer').classList.remove('hidden');\n}\nfunction closeTaskDrawer() { document.getElementById('task-drawer').classList.add('hidden'); currentTaskId = null; }\n\nfunction renderSubs() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  const box = document.getElementById('td-subs');\n  if (!t) { box.innerHTML = ''; return; }\n  const subs = t.subs || [];\n  document.getElementById('td-sub-sum').textContent = subs.filter(function (s) { return s.d; }).length + ' / ' + subs.length;\n  if (subs.length === 0) {\n    box.innerHTML = '&lt;p class=\&quot;text-[12px] text-[#a5a19b] px-1 py-2\&quot;&gt;暂无子任务，可拆成 2—3 个可执行步骤。&lt;/p&gt;';\n    return;\n  }\n  box.innerHTML = subs.map(function (s, i) {\n    return ''\n      + '&lt;div class=\&quot;flex items-center gap-2.5 px-2.5 py-2 rounded-[9px] border border-[#f2efea] hover:bg-[#fbfaf8]\&quot;&gt;'\n      +   '&lt;button onclick=\&quot;toggleSub(' + i + ')\&quot; class=\&quot;w-4 h-4 rounded-full border flex items-center justify-center shrink-0 ' + (s.d ? 'bg-[#2f7d74] border-[#2f7d74]' : 'border-[#cfc9c0]') + '\&quot;&gt;'\n      +     '&lt;iconify-icon icon=\&quot;ph:check-bold\&quot; class=\&quot;text-[9px] text-white ' + (s.d ? '' : 'hidden') + '\&quot;&gt;&lt;/iconify-icon&gt;'\n      +   '&lt;/button&gt;'\n      +   '&lt;span class=\&quot;text-[12.5px] ' + (s.d ? 'text-[#a5a19b] line-through' : 'text-[#33383c]') + '\&quot;&gt;' + s.t + '&lt;/span&gt;'\n      + '&lt;/div&gt;';\n  }).join('');\n}\n\nfunction toggleSub(i) {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t || !t.subs[i]) { return; }\n  t.subs[i].d = !t.subs[i].d;\n  renderSubs();\n  showToast(t.subs[i].d ? '子任务已完成' : '已取消子任务完成');\n}\n\nfunction tdAddSub() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  const txt = prompt('请输入子任务内容（原型示例）', '新增子任务');\n  if (txt &amp;&amp; txt.trim()) { t.subs.push({ t: txt.trim(), d: false }); renderSubs(); showToast('已添加子任务'); }\n}\n\nfunction renderTdProject(t) {\n  const box = document.getElementById('td-project-card');\n  const p = PROJECTS.find(function (x) { return x.name === t.project; });\n  if (!p) {\n    box.innerHTML = '&lt;p class=\&quot;text-[12px] text-[#a5a19b]\&quot;&gt;该任务未关联本地项目。&lt;/p&gt;';\n    return;\n  }\n  box.innerHTML = ''\n    + '&lt;div class=\&quot;flex items-center gap-2.5\&quot;&gt;'\n    +   '&lt;div class=\&quot;w-8 h-8 rounded-[9px] flex items-center justify-center text-[11px] font-semibold text-white shrink-0\&quot; style=\&quot;background:' + p.color + '\&quot;&gt;' + p.letter + '&lt;/div&gt;'\n    +   '&lt;div class=\&quot;min-w-0\&quot;&gt;'\n    +     '&lt;p class=\&quot;text-[12.5px] font-medium text-[#33383c]\&quot;&gt;' + p.name + '&lt;/p&gt;'\n    +     '&lt;p class=\&quot;text-[11px] text-[#8a8680]\&quot;&gt;' + p.path + ' · 最近打开 ' + p.last + '&lt;/p&gt;'\n    +   '&lt;/div&gt;'\n    +   '&lt;span class=\&quot;ml-auto text-[11px] px-2 py-[2px] rounded-full ' + STATUS[p.status].chip + '\&quot;&gt;' + STATUS[p.status].text + '&lt;/span&gt;'\n    + '&lt;/div&gt;'\n    + '&lt;div class=\&quot;mt-2.5 flex items-center gap-2\&quot;&gt;'\n    +   '&lt;a href=\&quot;projects.html\&quot; class=\&quot;h-8 px-2.5 rounded-full bg-white border border-[#e7e2da] text-[12px] text-[#5c5f63] hover:border-[#2f7d74] hover:text-[#2f7d74] flex items-center gap-1\&quot;&gt;'\n    +     '&lt;iconify-icon icon=\&quot;ph:arrow-square-out\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;打开关联项目&lt;/a&gt;'\n    +   '&lt;button onclick=\&quot;showToast(\\'已在文件管理器中打开 ' + p.path + '\\')\&quot; class=\&quot;h-8 px-2.5 rounded-full bg-white border border-[#e7e2da] text-[12px] text-[#5c5f63] hover:border-[#2f7d74] hover:text-[#2f7d74] flex items-center gap-1\&quot;&gt;'\n    +     '&lt;iconify-icon icon=\&quot;ph:folder-open\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;打开文件夹&lt;/button&gt;'\n    + '&lt;/div&gt;';\n}\n\nfunction tdToggleDone() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  toggleTask(t.id);\n  openTask(t.id);\n}\n\nfunction tdToggleKey() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  t.key = !t.key;\n  openTask(t.id);\n  renderTasks();\n  showToast(t.key ? '已设为今日重点' : '已取消今日重点');\n}\n\nfunction tdPostpone() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  postponeTask(t.id);\n  openTask(t.id);\n}\n\nfunction tdSave() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  const title = document.getElementById('td-title').value.trim();\n  if (!title) { showToast('任务名称不能为空', null, 'ph:warning-circle'); return; }\n  t.title = title;\n  t.desc = document.getElementById('td-desc').value.trim();\n  t.priority = document.getElementById('td-priority').value;\n  t.project = document.getElementById('td-project').value;\n  t.dueLabel = document.getElementById('td-due').value;\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('已保存「' + t.title + '」的修改');\n}\n\nfunction tdDelete() {\n  const t = TASKS.find(function (x) { return x.id === currentTaskId; });\n  if (!t) { return; }\n  const idx = TASKS.indexOf(t);\n  TASKS.splice(idx, 1);\n  closeTaskDrawer();\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('已删除「' + t.title + '」', function () { TASKS.splice(idx, 0, t); renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate); });\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 快速添加弹窗 ========== */\nlet quickTab = 'todo';\nfunction openQuickAdd(tab) {\n  setQuickTab(tab || 'todo');\n  document.getElementById('quick-modal').classList.remove('hidden');\n}\nfunction closeQuickAdd() { document.getElementById('quick-modal').classList.add('hidden'); }\n\nfunction setQuickTab(tab) {\n  quickTab = tab;\n  const map = { todo:'qa-todo', event:'qa-event', note:'qa-note' };\n  ['todo','event','note'].forEach(function (k) {\n    const btn = document.getElementById('qa-tab-' + k);\n    const on = k === tab;\n    btn.className = 'h-8 px-3.5 rounded-full text-[12.5px] ' + (on ? 'font-medium bg-white text-[#2f6b63] shadow-[0_1px_2px_rgba(16,24,40,.08)]' : 'text-[#6f6b66] hover:text-[#4b5158]');\n    document.getElementById(map[k] + '-fields').classList.toggle('hidden', !on);\n  });\n}\n\nfunction submitQuickAdd() {\n  if (quickTab === 'todo') {\n    const title = document.getElementById('qa-todo-title').value.trim();\n    if (!title) { showToast('请先填写任务名称', null, 'ph:warning-circle'); return; }\n    const dueLabel = document.getElementById('qa-todo-due').value;\n    const priorityMap = { '高':'high', '中':'medium', '低':'low' };\n    const task = {\n      id: 't' + (Date.now()),\n      title: title,\n      dueLabel: dueLabel,\n      dueDate: dueLabel.indexOf('明天') === 0 ? '2026-10-17' : '2026-10-16',\n      scope: dueLabel.indexOf('今天') === 0 ? 'today' : 'soon',\n      priority: priorityMap[document.getElementById('qa-todo-priority').value] || 'medium',\n      project: document.getElementById('qa-todo-project').value,\n      key: document.getElementById('qa-todo-key').checked,\n      done: false,\n      desc: document.getElementById('qa-todo-desc').value.trim(),\n      subs: []\n    };\n    TASKS.unshift(task);\n    document.getElementById('qa-todo-title').value = '';\n    document.getElementById('qa-todo-desc').value = '';\n    document.getElementById('qa-todo-key').checked = false;\n    closeQuickAdd();\n    currentTab = task.scope === 'today' ? 'today' : 'soon';\n    renderTasks();\n    renderUpcoming();\n    renderCalendar();\n    renderDay(selectedDate);\n    showToast('已添加到' + (task.scope === 'today' ? '今日待办' : '近期待办') + '：' + title, function () {\n      const i = TASKS.indexOf(task); if (i &gt; -1) { TASKS.splice(i, 1); } renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate);\n    });\n    return;\n  }\n\n  if (quickTab === 'event') {\n    const title = document.getElementById('qa-event-title').value.trim();\n    if (!title) { showToast('请先填写日程标题', null, 'ph:warning-circle'); return; }\n    const date = document.getElementById('qa-event-date').value || TODAY;\n    const ev = {\n      time: document.getElementById('qa-event-time').value || '09:00',\n      title: title,\n      sub: document.getElementById('qa-event-project').value + ' · 原型示例日程',\n      dur: document.getElementById('qa-event-dur').value\n    };\n    if (!EVENTS[date]) { EVENTS[date] = []; }\n    EVENTS[date].push(ev);\n    EVENTS[date].sort(function (a, b) { return a.time &gt; b.time ? 1 : -1; });\n    document.getElementById('qa-event-title').value = '';\n    closeQuickAdd();\n    selectedDate = date;\n    demoState.noSchedule = false;\n    openMonthPanel();\n    renderUpcoming();\n    renderCalendar();\n    renderDay(date);\n    showToast('已添加日程：' + ev.time + ' ' + title, function () {\n      const arr = EVENTS[date];\n      const i = arr.indexOf(ev); if (i &gt; -1) { arr.splice(i, 1); }\n      renderUpcoming(); renderCalendar(); renderDay(date);\n    });\n    return;\n  }\n\n  const text = document.getElementById('qa-note-text').value.trim();\n  if (!text) { showToast('请先填写笔记内容', null, 'ph:warning-circle'); return; }\n  const note = { id:'n' + Date.now(), text: text, tag: document.getElementById('qa-note-tag').value, time:'刚刚' };\n  NOTES.unshift(note);\n  document.getElementById('qa-note-text').value = '';\n  closeQuickAdd();\n  renderNotes();\n  showToast('笔记已保存，可在随手记中转为待办', function () {\n    const i = NOTES.indexOf(note); if (i &gt; -1) { NOTES.splice(i, 1); } renderNotes();\n  });\n}\n\n/* ========== 继续使用：最近项目精简入口 ========== */\nfunction renderProjects() {\n  const box = document.getElementById('project-list');\n  if (demoState.noProjects) {\n    box.innerHTML = ''\n      + '&lt;div class=\&quot;flex items-center gap-3 px-5 py-5 rounded-[18px] border border-dashed border-[#e2ddd4] bg-white/60\&quot;&gt;'\n      +   '&lt;iconify-icon icon=\&quot;ph:folder-dashed\&quot; class=\&quot;text-[22px] text-[#a5a19b]\&quot;&gt;&lt;/iconify-icon&gt;'\n      +   '&lt;div&gt;'\n      +     '&lt;p class=\&quot;text-[13px] text-[#5c5f63]\&quot;&gt;还没有添加本地项目&lt;/p&gt;'\n      +     '&lt;p class=\&quot;mt-0.5 text-[12px] text-[#a5a19b]\&quot;&gt;把常用仓库目录加进来，就能在这里一键启动。&lt;/p&gt;'\n      +   '&lt;/div&gt;'\n      +   '&lt;a href=\&quot;projects.html\&quot; class=\&quot;ml-auto h-8 px-3.5 rounded-full bg-[#2f7d74] text-white text-[12.5px] hover:bg-[#286b63] flex items-center\&quot;&gt;添加项目&lt;/a&gt;'\n      +   '&lt;button onclick=\&quot;applyDemoState(\\'noProjects\\', false); syncDemoSwitch()\&quot; class=\&quot;h-8 px-3.5 rounded-full border border-[#e7e2da] text-[12.5px] text-[#5c5f63] hover:bg-white\&quot;&gt;加载示例项目&lt;/button&gt;'\n      + '&lt;/div&gt;';\n    return;\n  }\n\n  box.innerHTML = '&lt;div class=\&quot;grid grid-cols-1 xl:grid-cols-2 gap-4\&quot;&gt;' + PROJECTS.slice(0, 2).map(function (p) {\n    const st = STATUS[p.status];\n    let primary = '';\n    if (p.status === 'running') {\n      primary = '&lt;button onclick=\&quot;openPort(\\'' + p.id + '\\')\&quot; class=\&quot;h-9 px-4 rounded-full bg-[#2f7d74] text-white text-[13px] font-medium hover:bg-[#286b63] flex items-center gap-1.5\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:monitor-play\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;打开预览&lt;/button&gt;';\n    } else if (p.status === 'starting') {\n      primary = '&lt;span class=\&quot;h-9 px-4 rounded-full bg-[#fbf1e6] text-[#a86b28] text-[13px] flex items-center gap-2\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:circle-notch\&quot; class=\&quot;spin text-[14px]\&quot;&gt;&lt;/iconify-icon&gt;启动中…&lt;/span&gt;';\n    } else if (p.status === 'failed') {\n      primary = '&lt;button onclick=\&quot;startProject(\\'' + p.id + '\\')\&quot; class=\&quot;h-9 px-4 rounded-full bg-[#c4473e] text-white text-[13px] font-medium hover:bg-[#ad3b33] flex items-center gap-1.5\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:arrow-clockwise\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;重试启动&lt;/button&gt;';\n    } else {\n      primary = '&lt;button onclick=\&quot;startProject(\\'' + p.id + '\\')\&quot; class=\&quot;h-9 px-4 rounded-full bg-[#2f7d74] text-white text-[13px] font-medium hover:bg-[#286b63] flex items-center gap-1.5\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:play\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;启动&lt;/button&gt;';\n    }\n    return ''\n      + '&lt;div class=\&quot;flex items-center gap-4 px-5 py-4.5 rounded-[18px] bg-white hover:shadow-[0_10px_26px_-18px_rgba(46,40,32,.5)] transition-shadow\&quot;&gt;'\n      +   '&lt;div class=\&quot;w-11 h-11 rounded-[13px] flex items-center justify-center text-[12.5px] font-semibold text-white shrink-0\&quot; style=\&quot;background:' + p.color + '\&quot;&gt;' + p.letter + '&lt;/div&gt;'\n      +   '&lt;div class=\&quot;min-w-0 flex-1\&quot;&gt;'\n      +     '&lt;div class=\&quot;flex items-center gap-2\&quot;&gt;'\n      +       '&lt;p class=\&quot;text-[14.5px] font-medium text-[#23282c] truncate\&quot;&gt;' + p.name + '&lt;/p&gt;'\n      +       '&lt;span class=\&quot;text-[11.5px] px-2 py-[2px] rounded-full ' + st.chip + ' shrink-0\&quot;&gt;' + st.text + '&lt;/span&gt;'\n      +     '&lt;/div&gt;'\n      +     '&lt;p class=\&quot;mt-1 text-[12.5px] text-[#9a968f] truncate\&quot;&gt;' + p.desc + '&lt;/p&gt;'\n      +     '&lt;p class=\&quot;mt-0.5 text-[12px] text-[#b0aca6]\&quot;&gt;最近打开 ' + p.last + '&lt;/p&gt;'\n      +   '&lt;/div&gt;'\n      +   '&lt;div class=\&quot;flex items-center gap-2 shrink-0\&quot;&gt;'\n      +     primary\n      +     '&lt;a href=\&quot;projects.html\&quot; title=\&quot;进入项目管理\&quot; class=\&quot;w-9 h-9 rounded-full text-[#a5a19b] hover:bg-[#f4f1ec] hover:text-[#2f7d74] flex items-center justify-center transition-colors\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:arrow-right\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/a&gt;'\n      +     '&lt;button onclick=\&quot;openProjectMenu(\\'' + p.id + '\\', event)\&quot; title=\&quot;更多操作\&quot; class=\&quot;w-9 h-9 rounded-full text-[#a5a19b] hover:bg-[#f4f1ec] hover:text-[#2f7d74] flex items-center justify-center transition-colors\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:dots-three\&quot; class=\&quot;text-[15px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n      +   '&lt;/div&gt;'\n      + '&lt;/div&gt;';\n  }).join('') + '&lt;/div&gt;';\n}\n\nfunction startProject(id) {\n  if (demoState.serviceDown) { showToast('本地服务已断开，请先在左下角重新连接', null, 'ph:plug-slash'); return; }\n  const p = PROJECTS.find(function (x) { return x.id === id; });\n  if (!p) { return; }\n  p.status = 'starting';\n  renderProjects();\n  setTimeout(function () {\n    if (p.status !== 'starting') { return; }\n    p.status = 'running';\n    p.port = 5173 + Math.floor(Math.random() * 20);\n    p.last = '刚刚';\n    renderProjects();\n    showToast(p.name + ' 已启动（原型示例）');\n  }, 1800);\n}\n\nfunction stopProject(id) {\n  const p = PROJECTS.find(function (x) { return x.id === id; });\n  if (!p) { return; }\n  p.status = 'stopped';\n  renderProjects();\n  showToast(p.name + ' 已停止运行');\n}\n\nfunction openPort(id) {\n  const p = PROJECTS.find(function (x) { return x.id === id; });\n  if (!p) { return; }\n  showToast('已在浏览器打开 http://localhost:' + p.port + '（原型示例）', null, 'ph:monitor-play');\n}\n\nfunction openProjectMenu(id, ev) {\n  ev.stopPropagation();\n  const p = PROJECTS.find(function (x) { return x.id === id; });\n  if (!p) { return; }\n  const items = [\n    { icon:'ph:push-pin', label:'置顶到继续使用', fn:function () { const i = PROJECTS.indexOf(p); PROJECTS.splice(i, 1); PROJECTS.unshift(p); renderProjects(); showToast('已置顶「' + p.name + '」'); } },\n    { icon:'ph:folder-simple', label:'进入项目管理', fn:function () { location.href = 'projects.html'; } },\n    { icon:'ph:copy', label:'复制仓库路径', fn:function () { showToast('已复制 ' + p.path); } },\n    { icon:'ph:x-circle', label:'移出继续使用', fn:function () { const i = PROJECTS.indexOf(p); PROJECTS.splice(i, 1); renderProjects(); showToast('已移出「' + p.name + '」', function () { PROJECTS.splice(i, 0, p); renderProjects(); }); } }\n  ];\n  showCtxMenu(ev.clientX, ev.clientY, items);\n}\n\nfunction showCtxMenu(x, y, items) {\n  const menu = document.getElementById('ctx-menu');\n  menu.innerHTML = items.map(function (it, i) {\n    return '&lt;button data-i=\&quot;' + i + '\&quot; class=\&quot;w-full flex items-center gap-2.5 h-8 px-2.5 rounded-[8px] text-[12.5px] text-[#5c5f63] hover:bg-[#f5f3ef] text-left\&quot;&gt;'\n      + '&lt;iconify-icon icon=\&quot;' + it.icon + '\&quot; class=\&quot;text-[15px] text-[#a5a19b]\&quot;&gt;&lt;/iconify-icon&gt;' + it.label + '&lt;/button&gt;';\n  }).join('');\n  menu.querySelectorAll('button').forEach(function (b) {\n    b.onclick = function () {\n      const it = items[parseInt(b.getAttribute('data-i'), 10)];\n      menu.classList.add('hidden');\n      if (it &amp;&amp; it.fn) { it.fn(); }\n    };\n  });\n  const maxX = window.innerWidth - 190;\n  const maxY = window.innerHeight - (items.length * 34 + 24);\n  menu.style.left = Math.min(x, maxX) + 'px';\n  menu.style.top = Math.min(y, maxY) + 'px';\n  menu.classList.remove('hidden');\n}\ndocument.addEventListener('click', function () { document.getElementById('ctx-menu').classList.add('hidden'); });\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 天气（紧凑展示，详情可展开） ========== */\nfunction toggleCityMenu() {\n  const menu = document.getElementById('city-menu');\n  if (!menu.classList.contains('hidden')) { menu.classList.add('hidden'); return; }\n  menu.innerHTML = Object.keys(WEATHER).map(function (c) {\n    const on = c === currentCity;\n    return '&lt;button onclick=\&quot;switchCity(\\'' + c + '\\')\&quot; class=\&quot;w-full h-8 px-2.5 rounded-[8px] text-[12.5px] text-left flex items-center gap-2 ' + (on ? 'bg-[#e9f2f0] text-[#2f6b63]' : 'text-[#5c5f63] hover:bg-[#f5f3ef]') + '\&quot;&gt;'\n      + c + (on ? '&lt;iconify-icon icon=\&quot;ph:check\&quot; class=\&quot;ml-auto text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;' : '') + '&lt;/button&gt;';\n  }).join('');\n  menu.classList.remove('hidden');\n}\n\nfunction switchCity(c) {\n  currentCity = c;\n  document.getElementById('city-label').textContent = c;\n  document.getElementById('city-menu').classList.add('hidden');\n  demoState.weatherError = false;\n  syncDemoSwitch();\n  renderWeather();\n  showToast('已切换到 ' + c + ' 的天气');\n}\n\nfunction refreshWeather() {\n  const icon = document.getElementById('weather-refresh');\n  icon.classList.add('spin');\n  setTimeout(function () {\n    icon.classList.remove('spin');\n    demoState.weatherError = false;\n    syncDemoSwitch();\n    renderWeather();\n    showToast('天气数据已更新（原型示例）');\n  }, 900);\n}\n\nfunction toggleWeather() {\n  weatherOpen = !weatherOpen;\n  renderWeather();\n}\n\nfunction renderWeather() {\n  const box = document.getElementById('weather-body');\n  const w = WEATHER[currentCity];\n  if (demoState.weatherError) {\n    box.innerHTML = ''\n      + '&lt;div class=\&quot;flex items-center gap-2.5 px-3 py-2.5 rounded-[14px] bg-[#fdf3f2]\&quot;&gt;'\n      +   '&lt;iconify-icon icon=\&quot;ph:cloud-slash\&quot; class=\&quot;text-[20px] text-[#c4473e]\&quot;&gt;&lt;/iconify-icon&gt;'\n      +   '&lt;div class=\&quot;min-w-0\&quot;&gt;'\n      +     '&lt;p class=\&quot;text-[12.5px] text-[#a03c34]\&quot;&gt;天气获取失败，请求超时&lt;/p&gt;'\n      +     '&lt;p class=\&quot;mt-0.5 text-[11.5px] text-[#b9786f]\&quot;&gt;其余模块不受影响&lt;/p&gt;'\n      +   '&lt;/div&gt;'\n      +   '&lt;button onclick=\&quot;demoState.weatherError=false; syncDemoSwitch(); renderWeather(); showToast(\\'天气数据已重新获取\\')\&quot; class=\&quot;ml-auto h-7 px-2.5 rounded-full bg-white text-[12px] text-[#c4473e]\&quot;&gt;重试&lt;/button&gt;'\n      + '&lt;/div&gt;';\n    return;\n  }\n  box.innerHTML = ''\n    + '&lt;div class=\&quot;flex items-end gap-2.5\&quot;&gt;'\n    +   '&lt;iconify-icon icon=\&quot;' + w.icon + '\&quot; class=\&quot;text-[34px] text-[#d9813c]\&quot;&gt;&lt;/iconify-icon&gt;'\n    +   '&lt;p class=\&quot;text-[30px] font-semibold leading-none text-[#23282c]\&quot;&gt;' + w.temp + '&lt;span class=\&quot;text-[15px] font-normal text-[#9a968f]\&quot;&gt;℃&lt;/span&gt;&lt;/p&gt;'\n    + '&lt;/div&gt;'\n    + '&lt;p class=\&quot;mt-2 text-[12.5px] text-[#6f6b66]\&quot;&gt;' + w.desc + ' · 最高 ' + w.high + '° / 最低 ' + w.low + '°&lt;/p&gt;'\n    + '&lt;p class=\&quot;mt-1.5 text-[12.5px] text-[#a86b28]\&quot;&gt;' + w.rain + '&lt;/p&gt;'\n    + '&lt;button onclick=\&quot;toggleWeather()\&quot; class=\&quot;mt-2.5 text-[12px] text-[#7d7a75] hover:text-[#2f7d74] flex items-center gap-1 transition-colors\&quot;&gt;'\n    +   (weatherOpen ? '收起天气详情' : '展开天气详情')\n    +   '&lt;iconify-icon icon=\&quot;' + (weatherOpen ? 'ph:caret-up' : 'ph:caret-down') + '\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n    + (weatherOpen ? ''\n      + '&lt;div class=\&quot;mt-2.5 flex items-center gap-2 text-[12px] text-[#8a8680]\&quot;&gt;'\n      +   '&lt;span&gt;' + w.humid + '&lt;/span&gt;&lt;span class=\&quot;text-[#ddd8d0]\&quot;&gt;·&lt;/span&gt;&lt;span&gt;' + w.wind + '&lt;/span&gt;&lt;span class=\&quot;text-[#ddd8d0]\&quot;&gt;·&lt;/span&gt;&lt;span&gt;更新于 10:45&lt;/span&gt;'\n      + '&lt;/div&gt;'\n      + '&lt;div class=\&quot;mt-3 grid grid-cols-4 gap-2\&quot;&gt;'\n      +   w.hours.map(function (h) {\n            return '&lt;div class=\&quot;text-center py-2 rounded-[10px] bg-[#f8f6f2]\&quot;&gt;'\n              + '&lt;p class=\&quot;text-[11px] text-[#a5a19b]\&quot;&gt;' + h[0] + '&lt;/p&gt;'\n              + '&lt;p class=\&quot;mt-1 text-[12.5px] font-medium text-[#33383c]\&quot;&gt;' + h[1] + '&lt;/p&gt;'\n              + '&lt;p class=\&quot;text-[10.5px] text-[#3d8fb5]\&quot;&gt;' + h[2] + '&lt;/p&gt;'\n              + '&lt;/div&gt;';\n          }).join('')\n      + '&lt;/div&gt;'\n      : '');\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 近期安排 + 按需展开的月历 ========== */\nfunction pad(n) { return n &lt; 10 ? '0' + n : '' + n; }\nfunction dateKey(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }\n\nfunction upcomingEvents() {\n  if (demoState.noSchedule) { return []; }\n  const keys = Object.keys(EVENTS).filter(function (k) { return k &gt;= TODAY; }).sort();\n  const list = [];\n  keys.forEach(function (k) {\n    EVENTS[k].forEach(function (e) { list.push({ date:k, time:e.time, title:e.title, sub:e.sub, dur:e.dur }); });\n  });\n  return list.slice(0, 2);\n}\n\nfunction relativeDay(key) {\n  if (key === TODAY) { return '今天'; }\n  if (key === '2026-10-17') { return '明天'; }\n  const parts = key.split('-');\n  return parseInt(parts[1], 10) + ' 月 ' + parseInt(parts[2], 10) + ' 日';\n}\n\nfunction renderUpcoming() {\n  const box = document.getElementById('upcoming-list');\n  const evs = upcomingEvents();\n  if (evs.length === 0) {\n    box.innerHTML = ''\n      + '&lt;div class=\&quot;flex items-center gap-2.5 px-4 py-3.5 rounded-[14px] bg-white/60\&quot;&gt;'\n      +   '&lt;iconify-icon icon=\&quot;ph:calendar-x\&quot; class=\&quot;text-[18px] text-[#a5a19b]\&quot;&gt;&lt;/iconify-icon&gt;'\n      +   '&lt;p class=\&quot;text-[12.5px] text-[#8a8680]\&quot;&gt;接下来没有安排，可以留一段专注时间。&lt;/p&gt;'\n      +   '&lt;button onclick=\&quot;openQuickAdd(\\'event\\')\&quot; class=\&quot;ml-auto text-[12px] text-[#2f7d74] hover:underline whitespace-nowrap\&quot;&gt;新建日程&lt;/button&gt;'\n      + '&lt;/div&gt;';\n    return;\n  }\n  box.innerHTML = evs.map(function (e) {\n    return ''\n      + '&lt;div class=\&quot;flex gap-4\&quot;&gt;'\n      +   '&lt;div class=\&quot;w-[74px] shrink-0\&quot;&gt;'\n      +     '&lt;p class=\&quot;text-[14px] font-semibold leading-none text-[#2f7d74]\&quot;&gt;' + e.time + '&lt;/p&gt;'\n      +     '&lt;p class=\&quot;mt-1.5 text-[11.5px] text-[#a5a19b]\&quot;&gt;' + relativeDay(e.date) + '&lt;/p&gt;'\n      +   '&lt;/div&gt;'\n      +   '&lt;div class=\&quot;flex-1 min-w-0 border-l-2 border-[#e3ece9] pl-4\&quot;&gt;'\n      +     '&lt;p class=\&quot;text-[14px] text-[#23282c] truncate\&quot;&gt;' + e.title + '&lt;/p&gt;'\n      +     '&lt;p class=\&quot;mt-1 text-[12px] text-[#9a968f] truncate\&quot;&gt;' + e.sub + ' · ' + e.dur + '&lt;/p&gt;'\n      +   '&lt;/div&gt;'\n      + '&lt;/div&gt;';\n  }).join('');\n}\n\nfunction toggleMonthPanel() {\n  if (monthOpen) { closeMonthPanel(); } else { openMonthPanel(); }\n}\n\nfunction openMonthPanel() {\n  monthOpen = true;\n  document.getElementById('month-panel').classList.remove('hidden');\n  document.getElementById('cal-toggle').classList.add('hidden');\n  renderCalendar();\n  renderDay(selectedDate);\n}\n\nfunction closeMonthPanel() {\n  monthOpen = false;\n  document.getElementById('month-panel').classList.add('hidden');\n  document.getElementById('cal-toggle').classList.remove('hidden');\n}\n\nfunction shiftMonth(delta) {\n  calMonth += delta;\n  if (calMonth &gt; 12) { calMonth = 1; calYear++; }\n  if (calMonth &lt; 1) { calMonth = 12; calYear--; }\n  renderCalendar();\n}\n\nfunction goToday() {\n  calYear = 2026; calMonth = 10; selectedDate = TODAY;\n  renderCalendar();\n  renderDay(TODAY);\n  showToast('已回到今天 10 月 16 日');\n}\n\nfunction renderCalendar() {\n  document.getElementById('cal-title').textContent = calYear + ' 年 ' + calMonth + ' 月';\n  const first = new Date(calYear, calMonth - 1, 1).getDay();\n  const days = new Date(calYear, calMonth, 0).getDate();\n  const prevDays = new Date(calYear, calMonth - 1, 0).getDate();\n  const cells = [];\n  for (let i = first - 1; i &gt;= 0; i--) { cells.push({ d: prevDays - i, other: true }); }\n  for (let d = 1; d &lt;= days; d++) { cells.push({ d: d, other: false }); }\n  while (cells.length % 7 !== 0) { cells.push({ d: cells.length - first - days + 1, other: true }); }\n\n  document.getElementById('cal-grid').innerHTML = cells.map(function (c) {\n    const key = c.other ? '' : dateKey(calYear, calMonth, c.d);\n    const evCount = (key &amp;&amp; EVENTS[key] &amp;&amp; !demoState.noSchedule) ? EVENTS[key].length : 0;\n    const dueCount = TASKS.filter(function (t) { return t.dueDate === key &amp;&amp; !t.done; }).length;\n    const isToday = key === TODAY;\n    const isSel = key === selectedDate;\n    let cls = 'relative mx-auto w-8 h-8 rounded-full text-[12.5px] flex flex-col items-center justify-center transition-colors cursor-pointer ';\n    if (c.other) { cls += 'text-[#cfc9c0] cursor-default'; }\n    else if (isSel) { cls += 'bg-[#2f7d74] text-white font-medium'; }\n    else if (isToday) { cls += 'bg-[#e9f2f0] text-[#2f6b63] font-medium hover:bg-[#dcebe7]'; }\n    else { cls += 'text-[#5c5f63] hover:bg-white'; }\n    const dotColor = evCount &amp;&amp; dueCount ? '#d9813c' : evCount ? '#2f7d74' : dueCount ? '#d9813c' : '';\n    return '&lt;div class=\&quot;flex justify-center\&quot;&gt;'\n      + '&lt;button ' + (c.other ? 'disabled' : 'onclick=\&quot;selectDate(\\'' + key + '\\')\&quot;') + ' class=\&quot;' + cls + '\&quot;&gt;'\n      +   '&lt;span&gt;' + c.d + '&lt;/span&gt;'\n      +   (dotColor ? '&lt;i class=\&quot;absolute bottom-[3px] w-1 h-1 rounded-full\&quot; style=\&quot;background:' + (isSel ? '#ffffff' : dotColor) + '\&quot;&gt;&lt;/i&gt;' : '')\n      + '&lt;/button&gt;'\n      + '&lt;/div&gt;';\n  }).join('');\n}\n\nfunction selectDate(key) {\n  selectedDate = key;\n  renderCalendar();\n  renderDay(key);\n}\n\nconst WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];\n\nfunction renderDay(key) {\n  const parts = key.split('-');\n  const m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);\n  const wd = new Date(parseInt(parts[0], 10), m - 1, d).getDay();\n  document.getElementById('day-title').textContent = m + ' 月 ' + d + ' 日 · ' + WEEK[wd];\n  const badge = document.getElementById('day-badge');\n  if (key === TODAY) { badge.classList.remove('hidden'); badge.textContent = '今天'; }\n  else { badge.classList.add('hidden'); }\n\n  const box = document.getElementById('day-agenda');\n  const evs = demoState.noSchedule ? [] : (EVENTS[key] || []);\n  const dueTasks = TASKS.filter(function (t) { return t.dueDate === key &amp;&amp; !t.done; });\n  let html = '';\n\n  if (evs.length === 0) {\n    html += '&lt;p class=\&quot;text-[12px] text-[#a5a19b]\&quot;&gt;当天没有日程，可以留给自己一段专注时间。&lt;/p&gt;';\n  } else {\n    html += evs.map(function (e) {\n      return ''\n        + '&lt;div class=\&quot;flex items-start gap-3\&quot;&gt;'\n        +   '&lt;span class=\&quot;text-[12.5px] font-medium text-[#2f7d74] w-[42px] shrink-0 mt-[1px]\&quot;&gt;' + e.time + '&lt;/span&gt;'\n        +   '&lt;div class=\&quot;min-w-0 flex-1 border-l-2 border-[#e3ece9] pl-3\&quot;&gt;'\n        +     '&lt;p class=\&quot;text-[12.5px] text-[#23282c]\&quot;&gt;' + e.title + '&lt;/p&gt;'\n        +     '&lt;p class=\&quot;mt-0.5 text-[11.5px] text-[#9a968f]\&quot;&gt;' + e.dur + '&lt;/p&gt;'\n        +   '&lt;/div&gt;'\n        + '&lt;/div&gt;';\n    }).join('');\n  }\n\n  html += '&lt;p class=\&quot;pt-2 text-[12px] text-[#a5a19b] flex items-center gap-1.5\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:flag\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;当日截止&lt;/p&gt;';\n  if (dueTasks.length === 0) {\n    html += '&lt;p class=\&quot;text-[12px] text-[#b0aca6]\&quot;&gt;当天没有待办截止。&lt;/p&gt;';\n  } else {\n    html += dueTasks.map(function (t) {\n      const p = PRIORITY[t.priority];\n      return ''\n        + '&lt;div onclick=\&quot;openTask(\\'' + t.id + '\\')\&quot; class=\&quot;flex items-center gap-2.5 cursor-pointer hover:bg-white rounded-[8px] px-1.5 py-1 transition-colors\&quot;&gt;'\n        +   '&lt;i class=\&quot;w-1.5 h-1.5 rounded-full shrink-0\&quot; style=\&quot;background:' + p.dot + '\&quot;&gt;&lt;/i&gt;'\n        +   '&lt;span class=\&quot;text-[12.5px] text-[#33383c] truncate\&quot;&gt;' + t.title + '&lt;/span&gt;'\n        +   '&lt;span class=\&quot;ml-auto shrink-0 text-[11px] ' + (t.overdue ? 'text-[#d05a4e]' : 'text-[#a86b28]') + '\&quot;&gt;截止 ' + (t.dueLabel.replace('今天 ', '').replace(' · 已逾期 1 天', ' · 逾期')) + '&lt;/span&gt;'\n        + '&lt;/div&gt;';\n    }).join('');\n  }\n\n  box.innerHTML = html;\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 常用工具：置顶与顺序调整 ========== */\nfunction renderTools() {\n  const box = document.getElementById('tool-grid');\n  const items = TOOLS.slice().sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });\n  const btn = 'w-5 h-5 rounded-full text-[#8a8680] hover:bg-[#eff2f0] hover:text-[#2f7d74] flex items-center justify-center';\n  box.innerHTML = items.map(function (t) {\n    return ''\n      + '&lt;div class=\&quot;group relative flex flex-col items-center gap-2 px-2 py-3.5 rounded-[18px] bg-white/70 hover:bg-white hover:shadow-[0_10px_24px_-18px_rgba(46,40,32,.6)] transition-all\&quot;&gt;'\n      +   '&lt;button type=\&quot;button\&quot; onclick=\&quot;runTool(\\'' + t.id + '\\')\&quot; class=\&quot;flex flex-col items-center gap-2 w-full focus:outline-none\&quot;&gt;'\n      +     '&lt;span class=\&quot;w-12 h-12 rounded-[15px] flex items-center justify-center transition-transform group-hover:scale-[1.04]\&quot; style=\&quot;background:' + t.bg + ';color:' + t.tint + '\&quot;&gt;'\n      +       '&lt;iconify-icon icon=\&quot;' + t.icon + '\&quot; class=\&quot;text-[23px]\&quot;&gt;&lt;/iconify-icon&gt;'\n      +     '&lt;/span&gt;'\n      +     '&lt;span class=\&quot;text-[12.5px] text-[#3c4045] leading-[17px] text-center\&quot;&gt;' + t.name + '&lt;/span&gt;'\n      +   '&lt;/button&gt;'\n      +   (t.pinned ? '&lt;iconify-icon icon=\&quot;ph:push-pin-fill\&quot; class=\&quot;absolute top-2.5 right-2.5 text-[11px] text-[#d9813c]\&quot;&gt;&lt;/iconify-icon&gt;' : '')\n      +   (t.pinned ? '' : '&lt;button onclick=\&quot;pinTool(\\'' + t.id + '\\')\&quot; title=\&quot;置顶\&quot; class=\&quot;absolute top-2 right-2 hidden group-hover:flex ' + btn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:push-pin\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;')\n      +   '&lt;div class=\&quot;absolute inset-x-2 bottom-1.5 hidden group-hover:flex items-center justify-center gap-1\&quot;&gt;'\n      +     '&lt;button onclick=\&quot;moveTool(\\'' + t.id + '\\',-1)\&quot; title=\&quot;前移\&quot; class=\&quot;' + btn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:arrow-left\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n      +     (t.pinned\n        ? '&lt;button onclick=\&quot;unpinTool(\\'' + t.id + '\\')\&quot; title=\&quot;取消置顶\&quot; class=\&quot;' + btn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:push-pin-slash\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n        : '&lt;button onclick=\&quot;pinTool(\\'' + t.id + '\\')\&quot; title=\&quot;置顶\&quot; class=\&quot;' + btn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:push-pin\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;')\n      +     '&lt;button onclick=\&quot;moveTool(\\'' + t.id + '\\',1)\&quot; title=\&quot;后移\&quot; class=\&quot;' + btn + '\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:arrow-right\&quot; class=\&quot;text-[12px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n      +   '&lt;/div&gt;'\n      + '&lt;/div&gt;';\n  }).join('');\n}\n\nfunction runTool(id) {\n  const t = TOOLS.find(function (x) { return x.id === id; });\n  if (t &amp;&amp; typeof t.run === 'function') { t.run(); }\n}\n\nfunction moveTool(id, dir) {\n  const i = TOOLS.findIndex(function (x) { return x.id === id; });\n  const j = i + dir;\n  if (i &lt; 0 || j &lt; 0 || j &gt;= TOOLS.length) { showToast(dir &lt; 0 ? '已经在最前面了' : '已经在最后面了'); return; }\n  const tmp = TOOLS[i]; TOOLS[i] = TOOLS[j]; TOOLS[j] = tmp;\n  renderTools();\n  showToast('已调整「' + tmp.name + '」的位置');\n}\n\nfunction pinTool(id) {\n  const i = TOOLS.findIndex(function (x) { return x.id === id; });\n  if (i &lt; 0) { return; }\n  const t = TOOLS[i];\n  t.pinned = true;\n  TOOLS.splice(i, 1);\n  TOOLS.unshift(t);\n  renderTools();\n  showToast('已置顶「' + t.name + '」', function () {\n    t.pinned = false;\n    TOOLS.splice(TOOLS.indexOf(t), 1);\n    TOOLS.splice(i, 0, t);\n    renderTools();\n  });\n}\n\nfunction unpinTool(id) {\n  const t = TOOLS.find(function (x) { return x.id === id; });\n  if (!t) { return; }\n  t.pinned = false;\n  renderTools();\n  showToast('已取消置顶「' + t.name + '」');\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 常用网站（低强调检索入口） ========== */\nfunction renderShortcuts() {\n  const q = (document.getElementById('sc-search').value || '').trim().toLowerCase();\n  const container = document.getElementById('shortcut-groups');\n  const matched = SHORTCUTS.filter(function (s) {\n    return !q || s.name.toLowerCase().indexOf(q) &gt; -1 || s.url.toLowerCase().indexOf(q) &gt; -1;\n  });\n  if (q &amp;&amp; matched.length === 0) {\n    container.innerHTML = '&lt;p class=\&quot;text-[12.5px] text-[#a5a19b] px-1\&quot;&gt;没有找到匹配的网站，换个关键词或&lt;a href=\&quot;shortcuts.html\&quot; class=\&quot;text-[#2f7d74] hover:underline\&quot;&gt;打开全部网站&lt;/a&gt;。&lt;/p&gt;';\n    return;\n  }\n  const items = q ? matched : matched.filter(function (s) { return s.pinned; });\n  const title = q ? '匹配结果' : '置顶网站';\n  container.innerHTML = '&lt;div class=\&quot;flex items-center gap-2 px-1\&quot;&gt;'\n    + '&lt;p class=\&quot;text-[12px] text-[#b0aca6]\&quot;&gt;' + title + '&lt;/p&gt;'\n    + items.map(function (s) {\n        return '&lt;button onclick=\&quot;openShortcut(\\'' + s.id + '\\')\&quot; class=\&quot;h-7 pl-1.5 pr-2.5 rounded-full bg-white/70 hover:bg-white text-[12px] text-[#5c5f63] flex items-center gap-1.5 transition-colors\&quot;&gt;'\n          + '&lt;span class=\&quot;w-4 h-4 rounded-[5px] flex items-center justify-center text-[8px] font-semibold text-white shrink-0\&quot; style=\&quot;background:' + s.color + '\&quot;&gt;' + s.letter + '&lt;/span&gt;'\n          + s.name + '&lt;/button&gt;';\n      }).join('')\n    + '&lt;/div&gt;';\n}\n\nfunction togglePin(id) {\n  const s = SHORTCUTS.find(function (x) { return x.id === id; });\n  if (!s) { return; }\n  s.pinned = !s.pinned;\n  renderShortcuts();\n  showToast(s.pinned ? '已置顶「' + s.name + '」' : '已取消置顶「' + s.name + '」');\n}\n\nfunction openShortcut(id) {\n  const s = SHORTCUTS.find(function (x) { return x.id === id; });\n  if (!s) { return; }\n  showToast('已在浏览器打开 ' + s.url + '（原型示例）', null, 'ph:arrow-square-out');\n}\n\nfunction openShortcutModal(mode, id) {\n  editingShortcutId = mode === 'edit' ? id : null;\n  const s = editingShortcutId ? SHORTCUTS.find(function (x) { return x.id === editingShortcutId; }) : null;\n  document.getElementById('sc-modal-title').textContent = s ? '编辑快捷网站' : '添加快捷网站';\n  document.getElementById('sc-name').value = s ? s.name : '';\n  document.getElementById('sc-url').value = s ? s.url : '';\n  document.getElementById('sc-group').value = s ? s.group : '开发';\n  document.getElementById('shortcut-modal').classList.remove('hidden');\n}\n\nfunction closeShortcutModal() { document.getElementById('shortcut-modal').classList.add('hidden'); editingShortcutId = null; }\n\nfunction submitShortcut() {\n  const name = document.getElementById('sc-name').value.trim();\n  const url = document.getElementById('sc-url').value.trim();\n  const group = document.getElementById('sc-group').value;\n  if (!name || !url) { showToast('请填写网站名称和网址', null, 'ph:warning-circle'); return; }\n  if (editingShortcutId) {\n    const s = SHORTCUTS.find(function (x) { return x.id === editingShortcutId; });\n    s.name = name; s.url = url; s.group = group;\n    closeShortcutModal();\n    renderShortcuts();\n    showToast('已更新「' + name + '」');\n  } else {\n    const colors = ['#2f7d74','#3d7fb5','#c07d34','#7d6bb0','#4b8f6d'];\n    const s = { id:'s' + Date.now(), group: group, name: name, url: url, letter: name.slice(0, 2), color: colors[SHORTCUTS.length % colors.length], pinned: false };\n    SHORTCUTS.push(s);\n    closeShortcutModal();\n    renderShortcuts();\n    showToast('已添加「' + name + '」到「' + group + '」分组', function () {\n      const i = SHORTCUTS.indexOf(s); if (i &gt; -1) { SHORTCUTS.splice(i, 1); } renderShortcuts();\n    });\n  }\n}\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 随手记 ========== */\nfunction renderNotes() {\n  const box = document.getElementById('note-list');\n  if (NOTES.length === 0) {\n    box.innerHTML = '&lt;p class=\&quot;text-[12.5px] text-[#a5a19b]\&quot;&gt;还没有随手记，在上方写下第一条想法吧。&lt;/p&gt;';\n    return;\n  }\n  box.innerHTML = NOTES.slice(0, 2).map(function (n) {\n    return ''\n      + '&lt;div class=\&quot;group flex items-start gap-2 px-1 py-2 rounded-[10px] hover:bg-white transition-colors\&quot;&gt;'\n      +   '&lt;p class=\&quot;min-w-0 flex-1 text-[12.5px] leading-[19px] text-[#5c5f63]\&quot;&gt;' + n.text + '&lt;/p&gt;'\n      +   '&lt;div class=\&quot;shrink-0 flex items-center gap-1\&quot;&gt;'\n      +     '&lt;span class=\&quot;text-[11px] text-[#a5a19b]\&quot;&gt;' + n.tag + '&lt;/span&gt;'\n      +     '&lt;button onclick=\&quot;noteToTask(\\'' + n.id + '\\')\&quot; title=\&quot;转为待办\&quot; class=\&quot;hidden group-hover:flex w-6 h-6 rounded-full text-[#a5a19b] hover:bg-[#eff2f0] hover:text-[#2f7d74] items-center justify-center\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:check-square\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n      +     '&lt;button onclick=\&quot;deleteNote(\\'' + n.id + '\\')\&quot; title=\&quot;删除\&quot; class=\&quot;hidden group-hover:flex w-6 h-6 rounded-full text-[#a5a19b] hover:bg-[#fbeeec] hover:text-[#c4473e] items-center justify-center\&quot;&gt;&lt;iconify-icon icon=\&quot;ph:trash\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'\n      +   '&lt;/div&gt;'\n      + '&lt;/div&gt;';\n  }).join('');\n}\n\nfunction saveNote() {\n  const input = document.getElementById('note-input');\n  const text = input.value.trim();\n  if (!text) { showToast('请先写下内容', null, 'ph:warning-circle'); return; }\n  const note = { id:'n' + Date.now(), text: text, tag: document.getElementById('note-tag').value, time:'刚刚' };\n  NOTES.unshift(note);\n  input.value = '';\n  document.getElementById('note-count').textContent = '0 / 200';\n  renderNotes();\n  showToast('已保存到随手记', function () { const i = NOTES.indexOf(note); if (i &gt; -1) { NOTES.splice(i, 1); } renderNotes(); });\n}\n\nfunction editNote(id) {\n  const n = NOTES.find(function (x) { return x.id === id; });\n  if (!n) { return; }\n  const txt = prompt('编辑笔记内容（原型示例）', n.text);\n  if (txt !== null &amp;&amp; txt.trim()) { n.text = txt.trim(); n.time = '刚刚编辑'; renderNotes(); showToast('笔记已更新'); }\n}\n\nfunction deleteNote(id) {\n  const i = NOTES.findIndex(function (x) { return x.id === id; });\n  if (i === -1) { return; }\n  const n = NOTES[i];\n  NOTES.splice(i, 1);\n  renderNotes();\n  showToast('已删除笔记', function () { NOTES.splice(i, 0, n); renderNotes(); });\n}\n\nfunction noteToTask(id) {\n  const n = NOTES.find(function (x) { return x.id === id; });\n  if (!n) { return; }\n  const task = {\n    id:'t' + Date.now(),\n    title: n.text.length &gt; 18 ? n.text.slice(0, 18) + '…' : n.text,\n    dueLabel:'明天 20:00', dueDate:'2026-10-17', scope:'soon', priority:'medium',\n    project:'不关联', key:false, done:false, desc:'由随手记转换：' + n.text, subs:[]\n  };\n  TASKS.unshift(task);\n  renderTasks();\n  renderUpcoming();\n  renderCalendar();\n  renderDay(selectedDate);\n  showToast('已转为待办：' + task.title, function () { const i = TASKS.indexOf(task); if (i &gt; -1) { TASKS.splice(i, 1); } renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate); });\n}\n\ndocument.getElementById('note-input').addEventListener('input', function () {\n  document.getElementById('note-count').textContent = this.value.length + ' / 200';\n});\n&lt;/script&gt;\n&lt;script&gt;\n/* ========== 全局搜索 ========== */\nfunction onGlobalSearch(q) {\n  const panel = document.getElementById('search-panel');\n  const query = (q || '').trim().toLowerCase();\n  if (!document.activeElement || document.activeElement.id !== 'global-search') {\n    if (query.length === 0) { return; }\n  }\n  let html = '';\n  if (query.length === 0) {\n    html = '&lt;p class=\&quot;px-2.5 pt-1.5 pb-1 text-[11.5px] text-[#a5a19b]\&quot;&gt;快速入口&lt;/p&gt;'\n      + '&lt;div class=\&quot;px-1.5 pb-1 flex flex-wrap gap-1.5\&quot;&gt;'\n      + ['今日待办','项目状态','本周日程','随手记','GitHub'].map(function (k) {\n          return '&lt;button onclick=\&quot;document.getElementById(\\'global-search\\').value=\\'' + k + '\\'; onGlobalSearch(\\'' + k + '\\')\&quot; class=\&quot;h-7 px-2.5 rounded-full bg-[#f5f3ef] text-[12px] text-[#5c5f63] hover:bg-[#eff2f0]\&quot;&gt;' + k + '&lt;/button&gt;';\n        }).join('')\n      + '&lt;/div&gt;';\n    panel.innerHTML = html;\n    panel.classList.remove('hidden');\n    return;\n  }\n\n  const tasks = TASKS.filter(function (t) { return t.title.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 4);\n  const projects = PROJECTS.filter(function (p) { return p.name.toLowerCase().indexOf(query) &gt; -1 || p.desc.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);\n  const notes = NOTES.filter(function (n) { return n.text.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);\n  const sites = SHORTCUTS.filter(function (s) { return s.name.toLowerCase().indexOf(query) &gt; -1 || s.url.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);\n\n  function group(title, icon, rows) {\n    if (rows.length === 0) { return ''; }\n    return '&lt;p class=\&quot;px-2.5 pt-2 pb-1 text-[11.5px] text-[#a5a19b] flex items-center gap-1.5\&quot;&gt;&lt;iconify-icon icon=\&quot;' + icon + '\&quot; class=\&quot;text-[13px]\&quot;&gt;&lt;/iconify-icon&gt;' + title + '&lt;/p&gt;' + rows.join('');\n  }\n\n  html += group('待办', 'ph:check-square', tasks.map(function (t) {\n    return '&lt;button onclick=\&quot;document.getElementById(\\'search-panel\\').classList.add(\\'hidden\\'); openTask(\\'' + t.id + '\\')\&quot; class=\&quot;w-full flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] text-left hover:bg-[#f5f3ef]\&quot;&gt;'\n      + '&lt;span class=\&quot;w-1.5 h-1.5 rounded-full shrink-0\&quot; style=\&quot;background:' + PRIORITY[t.priority].dot + '\&quot;&gt;&lt;/span&gt;'\n      + '&lt;span class=\&quot;text-[12.5px] text-[#33383c] truncate\&quot;&gt;' + t.title + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;ml-auto text-[11px] text-[#a5a19b] shrink-0\&quot;&gt;' + t.dueLabel + '&lt;/span&gt;&lt;/button&gt;';\n  }));\n\n  html += group('项目', 'ph:folder-simple', projects.map(function (p) {\n    return '&lt;a href=\&quot;projects.html\&quot; class=\&quot;flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] hover:bg-[#f5f3ef]\&quot;&gt;'\n      + '&lt;span class=\&quot;w-5 h-5 rounded-[6px] flex items-center justify-center text-[9px] font-semibold text-white shrink-0\&quot; style=\&quot;background:' + p.color + '\&quot;&gt;' + p.letter + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;text-[12.5px] text-[#33383c] truncate\&quot;&gt;' + p.name + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;ml-auto text-[11px] ' + STATUS[p.status].chip + ' px-1.5 py-[2px] rounded-full shrink-0\&quot;&gt;' + STATUS[p.status].text + '&lt;/span&gt;&lt;/a&gt;';\n  }));\n\n  html += group('笔记', 'ph:note-pencil', notes.map(function (n) {\n    return '&lt;a href=\&quot;notes.html\&quot; class=\&quot;flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] hover:bg-[#f5f3ef]\&quot;&gt;'\n      + '&lt;span class=\&quot;text-[12.5px] text-[#33383c] truncate\&quot;&gt;' + n.text + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;ml-auto text-[11px] text-[#a5a19b] shrink-0\&quot;&gt;' + n.tag + '&lt;/span&gt;&lt;/a&gt;';\n  }));\n\n  html += group('常用网站', 'ph:compass', sites.map(function (s) {\n    return '&lt;a href=\&quot;shortcuts.html\&quot; class=\&quot;flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] hover:bg-[#f5f3ef]\&quot;&gt;'\n      + '&lt;span class=\&quot;w-5 h-5 rounded-[6px] flex items-center justify-center text-[9px] font-semibold text-white shrink-0\&quot; style=\&quot;background:' + s.color + '\&quot;&gt;' + s.letter + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;text-[12.5px] text-[#33383c] truncate\&quot;&gt;' + s.name + '&lt;/span&gt;'\n      + '&lt;span class=\&quot;ml-auto text-[11px] text-[#a5a19b   const undoBtn = document.getElementById('toast-undo');

  if (undoFn) { undoBtn.classList.remove('hidden'); } else { undoBtn.classList.add('hidden'); }
  box.classList.remove('hidden');

  toastTimer = setTimeout(function () { box.classList.add('hidden'); }, 3200);
}

/* ========== 今日重点 ========== */
function tasksOfTab(tab) {
  return TASKS.filter(function (t) {
    if (tab === 'done') { return t.scope === 'done' || t.done === true; }
    if (t.done) { return false; }
    if (tab === 'today') { return t.scope === 'today'; }
    return t.scope === 'soon';
  });
}

/* 首页只挑最要紧的：未完成 + 优先重点 + 逾期优先，最多 3 件 */
function importantTasks() {
  const pending = TASKS.filter(function (t) { return !t.done; });
  const rank = { high:0, medium:1, low:2 };
  return pending.slice().sort(function (a, b) {
    const ao = a.overdue ? 0 : 1, bo = b.overdue ? 0 : 1;
    if (ao !== bo) { return ao - bo; }
    const ak = a.key ? 0 : 1, bk = b.key ? 0 : 1;
    if (ak !== bk) { return ak - bk; }
    return rank[a.priority] - rank[b.priority];
  }).slice(0, 3);
}

    };
    TASKS.unshift(task);
    document.getElementById('qa-todo-title').value = '';
    document.getElementById('qa-todo-desc').value = '';
    document.getElementById('qa-todo-key').checked = false;
    closeQuickAdd();
    currentTab = task.scope === 'today' ? 'today' : 'soon';
    renderTasks();
    renderUpcoming();
    renderCalendar();
    renderDay(selectedDate);
    showToast('已添加到' + (task.scope === 'today' ? '今日待办' : '近期待办') + '：' + title, function () {
      const i = TASKS.indexOf(task); if (i &gt; -1) { TASKS.splice(i, 1); } renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate);
    });
    return;
  }

  if (quickTab === 'event') {
    const title = document.getElementById('qa-event-title').value.trim();
    if (!title) { showToast('请先填写日程标题', null, 'ph:warning-circle'); return; }
    const date = document.getElementById('qa-event-date').value || TODAY;
    const ev = {
      time: document.getElementById('qa-event-time').value || '09:00',
      title: title,
      sub: document.getElementById('qa-event-project').value + ' · 原型示例日程',
      dur: document.getElementById('qa-event-dur').value
    };
    if (!EVENTS[date]) { EVENTS[date] = []; }
    EVENTS[date].push(ev);
    EVENTS[date].sort(function (a, b) { return a.time &gt; b.time ? 1 : -1; });
    document.getElementById('qa-event-title').value = '';
    closeQuickAdd();
    selectedDate = date;
    demoState.noSchedule = false;
    openMonthPanel();
    renderUpcoming();
    renderCalendar();
    renderDay(date);
    showToast('已添加日程：' + ev.time + ' ' + title, function () {
      const arr = EVENTS[date];
      const i = arr.indexOf(ev); if (i &gt; -1) { arr.splice(i, 1); }
      renderUpcoming(); renderCalendar(); renderDay(date);
    });
    return;
  }

  const text = document.getElementById('qa-note-text').value.trim();
  if (!text) { showToast('请先填写笔记内容', null, 'ph:warning-circle'); return; }
  const note = { id:'n' + Date.now(), text: text, tag: document.getElementById('qa-note-tag').value, time:'刚刚' };
  NOTES.unshift(note);
  document.getElementById('qa-note-text').value = '';
  closeQuickAdd();
  renderNotes();
  showToast('笔记已保存，可在随手记中转为待办', function () {
    const i = NOTES.indexOf(note); if (i &gt; -1) { NOTES.splice(i, 1); } renderNotes();
  });
}

&lt;script&gt;
/* ========== 近期安排 + 按需展开的月历 ========== */
function pad(n) { return n &lt; 10 ? '0' + n : '' + n; }
function dateKey(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }

function upcomingEvents() {
  if (demoState.noSchedule) { return []; }
  const keys = Object.keys(EVENTS).filter(function (k) { return k &gt;= TODAY; }).sort();
  const list = [];
  keys.forEach(function (k) {
    EVENTS[k].forEach(function (e) { list.push({ date:k, time:e.time, title:e.title, sub:e.sub, dur:e.dur }); });
  });
  return list.slice(0, 2);
}

function relativeDay(key) {
  if (key === TODAY) { return '今天'; }
  if (key === '2026-10-17') { return '明天'; }
  const parts = key.split('-');
  return parseInt(parts[1], 10) + ' 月 ' + parseInt(parts[2], 10) + ' 日';
}

function renderUpcoming() {
  const box = document.getElementById('upcoming-list');
  const evs = upcomingEvents();
  if (evs.length === 0) {
    box.innerHTML = ''
      + '&lt;div class=&quot;flex items-center gap-2.5 px-4 py-3.5 rounded-[14px] bg-white/60&quot;&gt;'
      +   '&lt;iconify-icon icon=&quot;ph:calendar-x&quot; class=&quot;text-[18px] text-[#a5a19b]&quot;&gt;&lt;/iconify-icon&gt;'
      +   '&lt;p class=&quot;text-[12.5px] text-[#8a8680]&quot;&gt;接下来没有安排，可以留一段专注时间。&lt;/p&gt;'
      +   '&lt;button onclick=&quot;openQuickAdd(\'event\')&quot; class=&quot;ml-auto text-[12px] text-[#2f7d74] hover:underline whitespace-nowrap&quot;&gt;新建日程&lt;/button&gt;'
      + '&lt;/div&gt;';
    return;
  }
  box.innerHTML = evs.map(function (e) {
    return ''
      + '&lt;div class=&quot;flex gap-4&quot;&gt;'
      +   '&lt;div class=&quot;w-[74px] shrink-0&quot;&gt;'
      +     '&lt;p class=&quot;text-[14px] font-semibold leading-none text-[#2f7d74]&quot;&gt;' + e.time + '&lt;/p&gt;'
      +     '&lt;p class=&quot;mt-1.5 text-[11.5px] text-[#a5a19b]&quot;&gt;' + relativeDay(e.date) + '&lt;/p&gt;'
      +   '&lt;/div&gt;'
      +   '&lt;div class=&quot;flex-1 min-w-0 border-l-2 border-[#e3ece9] pl-4&quot;&gt;'
      +     '&lt;p class=&quot;text-[14px] text-[#23282c] truncate&quot;&gt;' + e.title + '&lt;/p&gt;'
      +     '&lt;p class=&quot;mt-1 text-[12px] text-[#9a968f] truncate&quot;&gt;' + e.sub + ' · ' + e.dur + '&lt;/p&gt;'
      +   '&lt;/div&gt;'
      + '&lt;/div&gt;';
  }).join('');
}

function toggleMonthPanel() {
  if (monthOpen) { closeMonthPanel(); } else { openMonthPanel(); }
}

function openMonthPanel() {
  monthOpen = true;
  document.getElementById('month-panel').classList.remove('hidden');
  document.getElementById('cal-toggle').classList.add('hidden');
  renderCalendar();
  renderDay(selectedDate);
}

function closeMonthPanel() {
  monthOpen = false;
  document.getElementById('month-panel').classList.add('hidden');
  document.getElementById('cal-toggle').classList.remove('hidden');
}

function shiftMonth(delta) {
  calMonth += delta;
  if (calMonth &gt; 12) { calMonth = 1; calYear++; }
  if (calMonth &lt; 1) { calMonth = 12; calYear--; }
  renderCalendar();
}

function goToday() {
  calYear = 2026; calMonth = 10; selectedDate = TODAY;
  renderCalendar();
  renderDay(TODAY);
  showToast('已回到今天 10 月 16 日');
}

function renderCalendar() {
  document.getElementById('cal-title').textContent = calYear + ' 年 ' + calMonth + ' 月';
  const first = new Date(calYear, calMonth - 1, 1).getDay();
  const days = new Date(calYear, calMonth, 0).getDate();
  const prevDays = new Date(calYear, calMonth - 1, 0).getDate();
  const cells = [];
  for (let i = first - 1; i &gt;= 0; i--) { cells.push({ d: prevDays - i, other: true }); }
  for (let d = 1; d &lt;= days; d++) { cells.push({ d: d, other: false }); }
  while (cells.length % 7 !== 0) { cells.push({ d: cells.length - first - days + 1, other: true }); }

  document.getElementById('cal-grid').innerHTML = cells.map(function (c) {
    const key = c.other ? '' : dateKey(calYear, calMonth, c.d);
    const evCount = (key &amp;&amp; EVENTS[key] &amp;&amp; !demoState.noSchedule) ? EVENTS[key].length : 0;
    const dueCount = TASKS.filter(function (t) { return t.dueDate === key &amp;&amp; !t.done; }).length;
    const isToday = key === TODAY;
    const isSel = key === selectedDate;
    let cls = 'relative mx-auto w-8 h-8 rounded-full text-[12.5px] flex flex-col items-center justify-center transition-colors cursor-pointer ';
    if (c.other) { cls += 'text-[#cfc9c0] cursor-default'; }
    else if (isSel) { cls += 'bg-[#2f7d74] text-white font-medium'; }
    else if (isToday) { cls += 'bg-[#e9f2f0] text-[#2f6b63] font-medium hover:bg-[#dcebe7]'; }
    else { cls += 'text-[#5c5f63] hover:bg-white'; }
    const dotColor = evCount &amp;&amp; dueCount ? '#d9813c' : evCount ? '#2f7d74' : dueCount ? '#d9813c' : '';
    return '&lt;div class=&quot;flex justify-center&quot;&gt;'
      + '&lt;button ' + (c.other ? 'disabled' : 'onclick=&quot;selectDate(\'' + key + '\')&quot;') + ' class=&quot;' + cls + '&quot;&gt;'
      +   '&lt;span&gt;' + c.d + '&lt;/span&gt;'
      +   (dotColor ? '&lt;i class=&quot;absolute bottom-[3px] w-1 h-1 rounded-full&quot; style=&quot;background:' + (isSel ? '#ffffff' : dotColor) + '&quot;&gt;&lt;/i&gt;' : '')
      + '&lt;/button&gt;'
      + '&lt;/div&gt;';
  }).join('');
}

function selectDate(key) {
  selectedDate = key;
  renderCalendar();
  renderDay(key);
}

const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function renderDay(key) {
  const parts = key.split('-');
  const m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
  const wd = new Date(parseInt(parts[0], 10), m - 1, d).getDay();
  document.getElementById('day-title').textContent = m + ' 月 ' + d + ' 日 · ' + WEEK[wd];
  const badge = document.getElementById('day-badge');
  if (key === TODAY) { badge.classList.remove('hidden'); badge.textContent = '今天'; }
  else { badge.classList.add('hidden'); }

  const box = document.getElementById('day-agenda');
  const evs = demoState.noSchedule ? [] : (EVENTS[key] || []);
  const dueTasks = TASKS.filter(function (t) { return t.dueDate === key &amp;&amp; !t.done; });
  let html = '';

  if (evs.length === 0) {
    html += '&lt;p class=&quot;text-[12px] text-[#a5a19b]&quot;&gt;当天没有日程，可以留给自己一段专注时间。&lt;/p&gt;';
  } else {
    html += evs.map(function (e) {
      return ''
        + '&lt;div class=&quot;flex items-start gap-3&quot;&gt;'
        +   '&lt;span class=&quot;text-[12.5px] font-medium text-[#2f7d74] w-[42px] shrink-0 mt-[1px]&quot;&gt;' + e.time + '&lt;/span&gt;'
        +   '&lt;div class=&quot;min-w-0 flex-1 border-l-2 border-[#e3ece9] pl-3&quot;&gt;'
        +     '&lt;p class=&quot;text-[12.5px] text-[#23282c]&quot;&gt;' + e.title + '&lt;/p&gt;'
        +     '&lt;p class=&quot;mt-0.5 text-[11.5px] text-[#9a968f]&quot;&gt;' + e.dur + '&lt;/p&gt;'
        +   '&lt;/div&gt;'
        + '&lt;/div&gt;';
    }).join('');
  }

  html += '&lt;p class=&quot;pt-2 text-[12px] text-[#a5a19b] flex items-center gap-1.5&quot;&gt;&lt;iconify-icon icon=&quot;ph:flag&quot; class=&quot;text-[13px]&quot;&gt;&lt;/iconify-icon&gt;当日截止&lt;/p&gt;';
  if (dueTasks.length === 0) {
    html += '&lt;p class=&quot;text-[12px] text-[#b0aca6]&quot;&gt;当天没有待办截止。&lt;/p&gt;';
  } else {
    html += dueTasks.map(function (t) {
      const p = PRIORITY[t.priority];
      return ''
        + '&lt;div onclick=&quot;openTask(\'' + t.id + '\')&quot; class=&quot;flex items-center gap-2.5 cursor-pointer hover:bg-white rounded-[8px] px-1.5 py-1 transition-colors&quot;&gt;'
        +   '&lt;i class=&quot;w-1.5 h-1.5 rounded-full shrink-0&quot; style=&quot;background:' + p.dot + '&quot;&gt;&lt;/i&gt;'
        +   '&lt;span class=&quot;text-[12.5px] text-[#33383c] truncate&quot;&gt;' + t.title + '&lt;/span&gt;'
        +   '&lt;span class=&quot;ml-auto shrink-0 text-[11px] ' + (t.overdue ? 'text-[#d05a4e]' : 'text-[#a86b28]') + '&quot;&gt;截止 ' + (t.dueLabel.replace('今天 ', '').replace(' · 已逾期 1 天', ' · 逾期')) + '&lt;/span&gt;'
        + '&lt;/div&gt;';
    }).join('');
  }

  box.innerHTML = html;
}
&lt;/script&gt;
&lt;script&gt;
/* ========== 常用工具：置顶与顺序调整 ========== */
function renderTools() {
  const box = document.getElementById('tool-grid');
  const items = TOOLS.slice().sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
  const btn = 'w-5 h-5 rounded-full text-[#8a8680] hover:bg-[#eff2f0] hover:text-[#2f7d74] flex items-center justify-center';
  box.innerHTML = items.map(function (t) {
    return ''
      + '&lt;div class=&quot;group relative flex flex-col items-center gap-2 px-2 py-3.5 rounded-[18px] bg-white/70 hover:bg-white hover:shadow-[0_10px_24px_-18px_rgba(46,40,32,.6)] transition-all&quot;&gt;'
      +   '&lt;button type=&quot;button&quot; onclick=&quot;runTool(\'' + t.id + '\')&quot; class=&quot;flex flex-col items-center gap-2 w-full focus:outline-none&quot;&gt;'
      +     '&lt;span class=&quot;w-12 h-12 rounded-[15px] flex items-center justify-center transition-transform group-hover:scale-[1.04]&quot; style=&quot;background:' + t.bg + ';color:' + t.tint + '&quot;&gt;'
      +       '&lt;iconify-icon icon=&quot;' + t.icon + '&quot; class=&quot;text-[23px]&quot;&gt;&lt;/iconify-icon&gt;'
      +     '&lt;/span&gt;'
      +     '&lt;span class=&quot;text-[12.5px] text-[#3c4045] leading-[17px] text-center&quot;&gt;' + t.name + '&lt;/span&gt;'
      +   '&lt;/button&gt;'
      +   (t.pinned ? '&lt;iconify-icon icon=&quot;ph:push-pin-fill&quot; class=&quot;absolute top-2.5 right-2.5 text-[11px] text-[#d9813c]&quot;&gt;&lt;/iconify-icon&gt;' : '')
      +   (t.pinned ? '' : '&lt;button onclick=&quot;pinTool(\'' + t.id + '\')&quot; title=&quot;置顶&quot; class=&quot;absolute top-2 right-2 hidden group-hover:flex ' + btn + '&quot;&gt;&lt;iconify-icon icon=&quot;ph:push-pin&quot; class=&quot;text-[12px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;')
      +   '&lt;div class=&quot;absolute inset-x-2 bottom-1.5 hidden group-hover:flex items-center justify-center gap-1&quot;&gt;'
      +     '&lt;button onclick=&quot;moveTool(\'' + t.id + '\',-1)&quot; title=&quot;前移&quot; class=&quot;' + btn + '&quot;&gt;&lt;iconify-icon icon=&quot;ph:arrow-left&quot; class=&quot;text-[12px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'
      +     (t.pinned
        ? '&lt;button onclick=&quot;unpinTool(\'' + t.id + '\')&quot; title=&quot;取消置顶&quot; class=&quot;' + btn + '&quot;&gt;&lt;iconify-icon icon=&quot;ph:push-pin-slash&quot; class=&quot;text-[12px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'
        : '&lt;button onclick=&quot;pinTool(\'' + t.id + '\')&quot; title=&quot;置顶&quot; class=&quot;' + btn + '&quot;&gt;&lt;iconify-icon icon=&quot;ph:push-pin&quot; class=&quot;text-[12px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;')
      +     '&lt;button onclick=&quot;moveTool(\'' + t.id + '\',1)&quot; title=&quot;后移&quot; class=&quot;' + btn + '&quot;&gt;&lt;iconify-icon icon=&quot;ph:arrow-right&quot; class=&quot;text-[12px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'
      +   '&lt;/div&gt;'
      + '&lt;/div&gt;';
  }).join('');
}

function runTool(id) {
  const t = TOOLS.find(function (x) { return x.id === id; });
  if (t &amp;&amp; typeof t.run === 'function') { t.run(); }
}

function moveTool(id, dir) {
  const i = TOOLS.findIndex(function (x) { return x.id === id; });
  const j = i + dir;
  if (i &lt; 0 || j &lt; 0 || j &gt;= TOOLS.length) { showToast(dir &lt; 0 ? '已经在最前面了' : '已经在最后面了'); return; }
  const tmp = TOOLS[i]; TOOLS[i] = TOOLS[j]; TOOLS[j] = tmp;
  renderTools();
  showToast('已调整「' + tmp.name + '」的位置');
}

function pinTool(id) {
  const i = TOOLS.findIndex(function (x) { return x.id === id; });
  if (i &lt; 0) { return; }
  const t = TOOLS[i];
  t.pinned = true;
  TOOLS.splice(i, 1);
  TOOLS.unshift(t);
  renderTools();
  showToast('已置顶「' + t.name + '」', function () {
    t.pinned = false;
    TOOLS.splice(TOOLS.indexOf(t), 1);
    TOOLS.splice(i, 0, t);
    renderTools();
  });
}

function unpinTool(id) {
  const t = TOOLS.find(function (x) { return x.id === id; });
  if (!t) { return; }
  t.pinned = false;
  renderTools();
  showToast('已取消置顶「' + t.name + '」');
}
&lt;/script&gt;
&lt;script&gt;
/* ========== 常用网站（低强调检索入口） ========== */
function renderShortcuts() {
  const q = (document.getElementById('sc-search').value || '').trim().toLowerCase();
  const container = document.getElementById('shortcut-groups');
  const matched = SHORTCUTS.filter(function (s) {
    return !q || s.name.toLowerCase().indexOf(q) &gt; -1 || s.url.toLowerCase().indexOf(q) &gt; -1;
  });
  if (q &amp;&amp; matched.length === 0) {
    container.innerHTML = '&lt;p class=&quot;text-[12.5px] text-[#a5a19b] px-1&quot;&gt;没有找到匹配的网站，换个关键词或&lt;a href=&quot;shortcuts.html&quot; class=&quot;text-[#2f7d74] hover:underline&quot;&gt;打开全部网站&lt;/a&gt;。&lt;/p&gt;';
    return;
  }
  const items = q ? matched : matched.filter(function (s) { return s.pinned; });
  const title = q ? '匹配结果' : '置顶网站';
  container.innerHTML = '&lt;div class=&quot;flex items-center gap-2 px-1&quot;&gt;'
    + '&lt;p class=&quot;text-[12px] text-[#b0aca6]&quot;&gt;' + title + '&lt;/p&gt;'
    + items.map(function (s) {
        return '&lt;button onclick=&quot;openShortcut(\'' + s.id + '\')&quot; class=&quot;h-7 pl-1.5 pr-2.5 rounded-full bg-white/70 hover:bg-white text-[12px] text-[#5c5f63] flex items-center gap-1.5 transition-colors&quot;&gt;'
          + '&lt;span class=&quot;w-4 h-4 rounded-[5px] flex items-center justify-center text-[8px] font-semibold text-white shrink-0&quot; style=&quot;background:' + s.color + '&quot;&gt;' + s.letter + '&lt;/span&gt;'
          + s.name + '&lt;/button&gt;';
      }).join('')
    + '&lt;/div&gt;';
}

function togglePin(id) {
  const s = SHORTCUTS.find(function (x) { return x.id === id; });
  if (!s) { return; }
  s.pinned = !s.pinned;
  renderShortcuts();
  showToast(s.pinned ? '已置顶「' + s.name + '」' : '已取消置顶「' + s.name + '」');
}

function openShortcut(id) {
  const s = SHORTCUTS.find(function (x) { return x.id === id; });
  if (!s) { return; }
  showToast('已在浏览器打开 ' + s.url + '（原型示例）', null, 'ph:arrow-square-out');
}

function openShortcutModal(mode, id) {
  editingShortcutId = mode === 'edit' ? id : null;
  const s = editingShortcutId ? SHORTCUTS.find(function (x) { return x.id === editingShortcutId; }) : null;
  document.getElementById('sc-modal-title').textContent = s ? '编辑快捷网站' : '添加快捷网站';
  document.getElementById('sc-name').value = s ? s.name : '';
  document.getElementById('sc-url').value = s ? s.url : '';
  document.getElementById('sc-group').value = s ? s.group : '开发';
  document.getElementById('shortcut-modal').classList.remove('hidden');
}

function closeShortcutModal() { document.getElementById('shortcut-modal').classList.add('hidden'); editingShortcutId = null; }

function submitShortcut() {
  const name = document.getElementById('sc-name').value.trim();
  const url = document.getElementById('sc-url').value.trim();
  const group = document.getElementById('sc-group').value;
  if (!name || !url) { showToast('请填写网站名称和网址', null, 'ph:warning-circle'); return; }
  if (editingShortcutId) {
    const s = SHORTCUTS.find(function (x) { return x.id === editingShortcutId; });
    s.name = name; s.url = url; s.group = group;
    closeShortcutModal();
    renderShortcuts();
    showToast('已更新「' + name + '」');
  } else {
    const colors = ['#2f7d74','#3d7fb5','#c07d34','#7d6bb0','#4b8f6d'];
    const s = { id:'s' + Date.now(), group: group, name: name, url: url, letter: name.slice(0, 2), color: colors[SHORTCUTS.length % colors.length], pinned: false };
    SHORTCUTS.push(s);
    closeShortcutModal();
    renderShortcuts();
    showToast('已添加「' + name + '」到「' + group + '」分组', function () {
      const i = SHORTCUTS.indexOf(s); if (i &gt; -1) { SHORTCUTS.splice(i, 1); } renderShortcuts();
    });
  }
}

&lt;script&gt;
/* ========== 随手记 ========== */
function renderNotes() {
  const box = document.getElementById('note-list');
  if (NOTES.length === 0) {
    box.innerHTML = '&lt;p class=&quot;text-[12.5px] text-[#a5a19b]&quot;&gt;还没有随手记，在上方写下第一条想法吧。&lt;/p&gt;';
    return;
  }
  box.innerHTML = NOTES.slice(0, 2).map(function (n) {
    return ''
      + '&lt;div class=&quot;group flex items-start gap-2 px-1 py-2 rounded-[10px] hover:bg-white transition-colors&quot;&gt;'
      +   '&lt;p class=&quot;min-w-0 flex-1 text-[12.5px] leading-[19px] text-[#5c5f63]&quot;&gt;' + n.text + '&lt;/p&gt;'
      +   '&lt;div class=&quot;shrink-0 flex items-center gap-1&quot;&gt;'
      +     '&lt;span class=&quot;text-[11px] text-[#a5a19b]&quot;&gt;' + n.tag + '&lt;/span&gt;'
      +     '&lt;button onclick=&quot;noteToTask(\'' + n.id + '\')&quot; title=&quot;转为待办&quot; class=&quot;hidden group-hover:flex w-6 h-6 rounded-full text-[#a5a19b] hover:bg-[#eff2f0] hover:text-[#2f7d74] items-center justify-center&quot;&gt;&lt;iconify-icon icon=&quot;ph:check-square&quot; class=&quot;text-[13px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'
      +     '&lt;button onclick=&quot;deleteNote(\'' + n.id + '\')&quot; title=&quot;删除&quot; class=&quot;hidden group-hover:flex w-6 h-6 rounded-full text-[#a5a19b] hover:bg-[#fbeeec] hover:text-[#c4473e] items-center justify-center&quot;&gt;&lt;iconify-icon icon=&quot;ph:trash&quot; class=&quot;text-[13px]&quot;&gt;&lt;/iconify-icon&gt;&lt;/button&gt;'
      +   '&lt;/div&gt;'
      + '&lt;/div&gt;';
  }).join('');
}

function saveNote() {
  const input = document.getElementById('note-input');
  const text = input.value.trim();
  if (!text) { showToast('请先写下内容', null, 'ph:warning-circle'); return; }
  const note = { id:'n' + Date.now(), text: text, tag: document.getElementById('note-tag').value, time:'刚刚' };
  NOTES.unshift(note);
  input.value = '';
  document.getElementById('note-count').textContent = '0 / 200';
  renderNotes();
  showToast('已保存到随手记', function () { const i = NOTES.indexOf(note); if (i &gt; -1) { NOTES.splice(i, 1); } renderNotes(); });
}

function editNote(id) {
  const n = NOTES.find(function (x) { return x.id === id; });
  if (!n) { return; }
  const txt = prompt('编辑笔记内容（原型示例）', n.text);
  if (txt !== null &amp;&amp; txt.trim()) { n.text = txt.trim(); n.time = '刚刚编辑'; renderNotes(); showToast('笔记已更新'); }
}

function deleteNote(id) {
  const i = NOTES.findIndex(function (x) { return x.id === id; });
  if (i === -1) { return; }
  const n = NOTES[i];
  NOTES.splice(i, 1);
  renderNotes();
  showToast('已删除笔记', function () { NOTES.splice(i, 0, n); renderNotes(); });
}

function noteToTask(id) {
  const n = NOTES.find(function (x) { return x.id === id; });
  if (!n) { return; }
  const task = {
    id:'t' + Date.now(),
    title: n.text.length &gt; 18 ? n.text.slice(0, 18) + '…' : n.text,
    dueLabel:'明天 20:00', dueDate:'2026-10-17', scope:'soon', priority:'medium',
    project:'不关联', key:false, done:false, desc:'由随手记转换：' + n.text, subs:[]
  };
  TASKS.unshift(task);
  renderTasks();
  renderUpcoming();
  renderCalendar();
  renderDay(selectedDate);
  showToast('已转为待办：' + task.title, function () { const i = TASKS.indexOf(task); if (i &gt; -1) { TASKS.splice(i, 1); } renderTasks(); renderUpcoming(); renderCalendar(); renderDay(selectedDate); });
}

document.getElementById('note-input').addEventListener('input', function () {
  document.getElementById('note-count').textContent = this.value.length + ' / 200';
});
