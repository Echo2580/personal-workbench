/* ========== 全局搜索 ========== */
function onGlobalSearch(q) {
  const panel = document.getElementById('search-panel');
  const query = (q || '').trim().toLowerCase();
  if (!document.activeElement || document.activeElement.id !== 'global-search') {
    if (query.length === 0) { return; }
  }
  let html = '';
  if (query.length === 0) {
    html = '&lt;p class=&quot;px-2.5 pt-1.5 pb-1 text-[11.5px] text-[#a5a19b]&quot;&gt;快速入口&lt;/p&gt;'
      + '&lt;div class=&quot;px-1.5 pb-1 flex flex-wrap gap-1.5&quot;&gt;'
      + ['今日待办','项目状态','本周日程','随手记','GitHub'].map(function (k) {
          return '&lt;button onclick=&quot;document.getElementById(\'global-search\').value=\'' + k + '\'; onGlobalSearch(\'' + k + '\')&quot; class=&quot;h-7 px-2.5 rounded-full bg-[#f5f3ef] text-[12px] text-[#5c5f63] hover:bg-[#eff2f0]&quot;&gt;' + k + '&lt;/button&gt;';
        }).join('')
      + '&lt;/div&gt;';
    panel.innerHTML = html;
    panel.classList.remove('hidden');
    return;
  }

  const tasks = TASKS.filter(function (t) { return t.title.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 4);
  const projects = PROJECTS.filter(function (p) { return p.name.toLowerCase().indexOf(query) &gt; -1 || p.desc.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);
  const notes = NOTES.filter(function (n) { return n.text.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);
  const sites = SHORTCUTS.filter(function (s) { return s.name.toLowerCase().indexOf(query) &gt; -1 || s.url.toLowerCase().indexOf(query) &gt; -1; }).slice(0, 3);

  function group(title, icon, rows) {
    if (rows.length === 0) { return ''; }
    return '&lt;p class=&quot;px-2.5 pt-2 pb-1 text-[11.5px] text-[#a5a19b] flex items-center gap-1.5&quot;&gt;&lt;iconify-icon icon=&quot;' + icon + '&quot; class=&quot;text-[13px]&quot;&gt;&lt;/iconify-icon&gt;' + title + '&lt;/p&gt;' + rows.join('');
  }

  html += group('待办', 'ph:check-square', tasks.map(function (t) {
    return '&lt;button onclick=&quot;document.getElementById(\'search-panel\').classList.add(\'hidden\'); openTask(\'' + t.id + '\')&quot; class=&quot;w-full flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] text-left hover:bg-[#f5f3ef]&quot;&gt;'
      + '&lt;span class=&quot;w-1.5 h-1.5 rounded-full shrink-0&quot; style=&quot;background:' + PRIORITY[t.priority].dot + '&quot;&gt;&lt;/span&gt;'
      + '&lt;span class=&quot;text-[12.5px] text-[#33383c] truncate&quot;&gt;' + t.title + '&lt;/span&gt;'
      + '&lt;span class=&quot;ml-auto text-[11px] text-[#a5a19b] shrink-0&quot;&gt;' + t.dueLabel + '&lt;/span&gt;&lt;/button&gt;';
  }));

  html += group('项目', 'ph:folder-simple', projects.map(function (p) {
    return '&lt;a href=&quot;projects.html&quot; class=&quot;flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] hover:bg-[#f5f3ef]&quot;&gt;'
      + '&lt;span class=&quot;w-5 h-5 rounded-[6px] flex items-center justify-center text-[9px] font-semibold text-white shrink-0&quot; style=&quot;background:' + p.color + '&quot;&gt;' + p.letter + '&lt;/span&gt;'
      + '&lt;span class=&quot;text-[12.5px] text-[#33383c] truncate&quot;&gt;' + p.name + '&lt;/span&gt;'
      + '&lt;span class=&quot;ml-auto text-[11px] ' + STATUS[p.status].chip + ' px-1.5 py-[2px] rounded-full shrink-0&quot;&gt;' + STATUS[p.status].text + '&lt;/span&gt;&lt;/a&gt;';
  }));

  html += group('笔记', 'ph:note-pencil', notes.map(function (n) {
    return '&lt;a href=&quot;notes.html&quot; class=&quot;flex items-center gap-2.5 h-9 px-2.5 rounded-[9px] hover:bg-[#f5f3ef]&quot;&gt;'
      + '&lt;span class=&quot;text-[12.5px] text-[#33383c] truncate&quot;&gt;' + n.text + '&lt;/span&gt;'
      + '&lt;span class=&quot;ml-auto text-[11px] text-[#a5a19b] shrink-0&quot;&gt;' + n.tag + '&lt;/span&gt;&lt;/a&gt;';
  }));

  html += group('常用网站', 'ph:compass', sites.map(function (s) {

      + '&lt;span class=&quot;w-5 h-5 rounded-[6px] flex items-center justify-center text-[9px] font-semibold text-white shrink-0&quot; style=&quot;background:' + s.color + '&quot;&gt;' + s.letter + '&lt;/span&gt;'
      + '&lt;span class=&quot;text-[12.5px] text-[#33383c] truncate&quot;&gt;' + s.name + '&lt;/span&gt;'
      + '&lt;span class=&quot;ml-auto text-[11px] text-[#a5a19b] shrink-0&quot;&gt;' + s.url + '&lt;/span&gt;&lt;/a&gt;';
  }));

  if (!html) {

  }

  panel.classList.remove('hidden');

document.addEventListener('click', function (e) {
  const panel = document.getElementById('search-panel');
  const input = document.getElementById('global-search');
  if (panel &amp;&amp; !panel.contains(e.target) &amp;&amp; e.target !== input) { panel.classList.add('hidden'); }
  const cityMenu = document.getElementById('city-menu');
  const cityBtn = cityMenu.previousElementSibling;
  if (cityMenu &amp;&amp; !cityMenu.contains(e.target) &amp;&amp; e.target !== cityBtn &amp;&amp; !cityBtn.contains(e.target)) { cityMenu.classList.add('hidden'); }

document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) &amp;&amp; (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    document.getElementById('global-search').focus();
  }
  if (e.key === 'Escape') {

    closeTaskDrawer();
    closeSettings();
    closeShortcutModal();
    document.getElementById('search-panel').classList.add('hidden');
    document.getElementById('city-menu').classList.add('hidden');

&lt;script&gt;
/* ========== 自定义首页：模块显隐 / 顺序 / 演示状态 ========== */
const DEMO_ITEMS = [
  { key:'allDone',      title:'今日任务全部完成', desc:'待办列表切换到完成态，并显示完成提示条' },
  { key:'noSchedule',   title:'当天无日程',       desc:'日历仍显示日期圆点规则，日程区域显示空状态' },
  { key:'noProjects',   title:'没有本地项目',     desc:'继续使用区域显示空状态与添加引导' },
  { key:'weatherError', title:'天气获取失败',     desc:'天气区域显示错误信息与重试按钮' },
  { key:'serviceDown',  title:'本地服务已断开',   desc:'左下角服务状态变红，并显示顶部提示条' }
];

function renderDemoSwitches() {
  const box = document.getElementById('demo-switches');
  box.innerHTML = DEMO_ITEMS.map(function (it) {
    const on = demoState[it.key];
    return ''
      + '&lt;div data-demo=&quot;' + it.key + '&quot; class=&quot;flex items-start gap-3 p-3 rounded-[12px] border border-[#f0ece5]&quot;&gt;'
      +   '&lt;div class=&quot;min-w-0&quot;&gt;'
      +     '&lt;p class=&quot;text-[13px] text-[#33383c]&quot;&gt;' + it.title + '&lt;/p&gt;'
      +     '&lt;p class=&quot;mt-0.5 text-[11.5px] leading-[17px] text-[#8a8680]&quot;&gt;' + it.desc + '&lt;/p&gt;'
      +   '&lt;/div&gt;'
      +   '&lt;button role=&quot;switch&quot; aria-checked=&quot;' + on + '&quot; onclick=&quot;toggleDemo(\'' + it.key + '\', this)&quot; class=&quot;ml-auto mt-0.5 shrink-0 relative w-[36px] h-[20px] rounded-full transition-colors&quot; style=&quot;background:' + (on ? '#2f7d74' : '#d9d4cc') + '&quot;&gt;'
      +     '&lt;span class=&quot;sw-track absolute top-[2px] w-4 h-4 rounded-full bg-white transition-all&quot; style=&quot;left:' + (on ? '18px' : '2px') + '&quot;&gt;&lt;/span&gt;'
      +   '&lt;/button&gt;'
      + '&lt;/div&gt;';
  }).join('');
}

function setSwitch(rowEl, on) {
  if (!rowEl) { return; }
  const btn = rowEl.querySelector('button[role=&quot;switch&quot;]');
  if (!btn) { return; }
  btn.setAttribute('aria-checked', on ? 'true' : 'false');
  btn.style.background = on ? '#2f7d74' : '#d9d4cc';
  const knob = btn.querySelector('.sw-track');
  if (knob) { knob.style.left = on ? '18px' : '2px'; }
}

function syncDemoSwitch() {
  DEMO_ITEMS.forEach(function (it) {
    setSwitch(document.querySelector('[data-demo=&quot;' + it.key + '&quot;]'), demoState[it.key]);
  });
}

function toggleDemo(key, el) {
  applyDemoState(key, !demoState[key]);
  renderDemoSwitches();
}

function applyDemoState(key, on) {
  demoState[key] = on;
  if (key === 'allDone') {
    if (on) {
      allDoneSnapshot = TASKS.filter(function (t) { return t.scope !== 'done'; }).map(function (t) { return { id:t.id, done:t.done, doneAt:t.doneAt }; });
      TASKS.forEach(function (t) { if (t.scope !== 'done') { t.done = true; t.doneAt = '刚刚'; } });
    } else if (allDoneSnapshot) {
      allDoneSnapshot.forEach(function (s) {
        const t = TASKS.find(function (x) { return x.id === s.id; });
        if (t) { t.done = s.done; if (s.doneAt) { t.doneAt = s.doneAt; } else { delete t.doneAt; } }
      });
      allDoneSnapshot = null;
    }
    renderTasks();
    renderCalendar();
    renderDay(selectedDate);
  }
  if (key === 'noSchedule') { renderUpcoming(); renderCalendar(); renderDay(selectedDate); }
  if (key === 'noProjects') { renderProjects(); }
  if (key === 'weatherError') { renderWeather(); }
  if (key === 'serviceDown') { renderService(); }
  showToast('演示状态已' + (on ? '打开' : '关闭') + '：' + (DEMO_ITEMS.find(function (x) { return x.key === key; }) || {}).title);
}

function renderService() {
  const dot = document.getElementById('svc-dot');
  const text = document.getElementById('svc-text');
  const sub = document.getElementById('svc-sub');
  const btn = document.getElementById('svc-btn');
  const banner = document.getElementById('offline-banner');
  if (demoState.serviceDown) {
    dot.style.background = '#d05a4e';
    dot.classList.add('dot-flash');
    text.textContent = '本地服务已断开';
    text.className = 'text-[12px] text-[#c4473e]';
    sub.textContent = '无法连接 localhost:5173，项目启动暂不可用';
    btn.textContent = '重新连接';
    btn.className = 'mt-2 h-7 px-2.5 rounded-full border border-[#eecdc9] text-[11.5px] text-[#c4473e] hover:bg-[#fdf3f2] transition-colors';
    banner.classList.remove('hidden');
  } else {
    dot.style.background = '#3fae7f';
    dot.classList.remove('dot-flash');
    text.textContent = '本地服务运行中';
    text.className = 'text-[12px] text-[#5f7d74]';
    sub.textContent = '端口 5173 · 已加载 ' + PROJECTS.length + ' 个项目';
    btn.textContent = '重启本地服务';
    btn.className = 'mt-2 h-7 px-2.5 rounded-full border border-[#e4dfd7] text-[11.5px] text-[#6b6862] hover:border-[#2f7d74] hover:text-[#2f7d74] transition-colors';
    banner.classList.add('hidden');
  }
}

function restartService() {
  const btn = document.getElementById('svc-btn');
  if (demoState.serviceDown) {
    btn.textContent = '连接中…';
    setTimeout(function () { demoState.serviceDown = false; renderService(); renderDemoSwitches(); showToast('本地服务已重新连接'); }, 1200);
    return;
  }
  btn.textContent = '重启中…';
  setTimeout(function () {
    renderService();
    showToast('本地服务已重启，端口 5173 可用');
  }, 1200);
}

function reconnect() {
  demoState.serviceDown = false;
  renderService();
  renderDemoSwitches();
  showToast('已重新连接本地服务');
}

const MODULE_NAMES = { tools:'常用工具', todos:'今日重点', calendar:'近期安排', notes:'随手记', projects:'继续使用', shortcuts:'常用网站' };

function toggleModule(key, btn) {
  hiddenModules[key] = !hiddenModules[key];
  const section = document.querySelector('[data-module=&quot;' + key + '&quot;]');
  if (section) { section.classList.toggle('hidden', hiddenModules[key]); }
  setSwitchRowByKey(key, !hiddenModules[key]);
  showToast(hiddenModules[key] ? '已隐藏该模块' : '已显示该模块');
}

function setSwitchRowByKey(key, on) {
  const rows = document.querySelectorAll('#settings-drawer button[role=&quot;switch&quot;]');
  rows.forEach(function (r) {
    const row = r.closest('div');
    const label = row ? row.querySelector('span.flex-1') : null;
    if (label &amp;&amp; label.textContent === MODULE_NAMES[key]) { setSwitch(row, on); }
  });
}

function moveModule(key, dir) {
  const zoneKey = moduleOrder.work.indexOf(key) &gt; -1 ? 'work' : 'main';
  const arr = moduleOrder[zoneKey].slice();
  const i = arr.indexOf(key);
  const j = i + dir;
  if (i &lt; 0) { return; }
  if (j &lt; 0 || j &gt;= arr.length) { showToast('已经在' + (dir &lt; 0 ? '最前面' : '最后面') + '了'); return; }
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  moduleOrder[zoneKey] = arr;
  const container = document.getElementById(MODULE_ZONES[zoneKey].slice(1));
  arr.forEach(function (k) {
    const sec = document.querySelector('[data-module=&quot;' + k + '&quot;]');
    if (sec &amp;&amp; container) { container.appendChild(sec); }
  });
  showToast('已调整模块顺序');
}

function openSettings() {
  renderDemoSwitches();
  document.getElementById('settings-drawer').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settings-drawer').classList.add('hidden');
  if (location.hash === '#settings') { history.replaceState(null, '', location.pathname); }
}

function resetSettings() {
  Object.keys(hiddenModules).forEach(function (k) { hiddenModules[k] = false; });
  ['tools','todos','calendar','notes','projects','shortcuts'].forEach(function (k) {
    const sec = document.querySelector('[data-module=&quot;' + k + '&quot;]');
    if (sec) { sec.classList.remove('hidden'); }
    setSwitchRowByKey(k, true);
  });
  moduleOrder.main = ['todos','calendar','notes'];
  moduleOrder.work = ['tools','projects','shortcuts'];
  const main = document.getElementById('zone-main');
  const work = document.getElementById('zone-work');
  ['mod-todos','mod-calendar','mod-notes'].forEach(function (id) { main.appendChild(document.getElementById(id)); });
  ['mod-tools'].forEach(function (id) { work.insertBefore(document.getElementById(id), work.firstChild); });
  ['mod-projects','mod-shortcuts'].forEach(function (id) { work.appendChild(document.getElementById(id)); });
  DEMO_ITEMS.forEach(function (it) { if (demoState[it.key]) { applyDemoState(it.key, false); } });
  renderDemoSwitches();
  showToast('已恢复默认显示');
}
