<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光工作台</title>
<style>
:root{
  --accent:#d96f32;
  --accent-soft:#f4e3d7;
  --teal:#3a716c;
  --ink:#2c2a26;
  --ink-2:#6f6a61;
  --paper:#fbfaf7;
  --paper-2:#f3f1ec;
  --line:#d8d3c8;
  --line-strong:#b9b2a3;
  --shadow:0 1px 2px rgba(40,35,25,.12), 0 8px 24px rgba(40,35,25,.14);
  --shadow-active:0 1px 2px rgba(40,35,25,.14), 0 14px 36px rgba(40,35,25,.2);
  --radius:10px;
  --dock-h:76px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:15px;color:var(--ink);background:#8a9296}

/* ---------- 桌面层 ---------- */
#wallpaper{position:fixed;inset:0;background-size:cover;background-position:center;transition:background .35s ease, filter .25s ease}
#wallpaper-tint{position:fixed;inset:0;pointer-events:none;transition:background .25s ease}
#desktop{position:fixed;inset:0}

/* 角落日期/天气 */
#corner-clock{position:fixed;top:18px;left:22px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none;user-select:none}
#corner-clock .date{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;opacity:.92}
#corner-clock .time{font-family:var(--mono);font-size:30px;line-height:1.15;letter-spacing:.02em}
#corner-clock .lunar{font-size:12px;opacity:.85;margin-top:2px}

/* 像素鲸鱼 */
#whale{position:fixed;left:20px;bottom:calc(var(--dock-h) + 14px);opacity:.75;image-rendering:pixelated;pointer-events:none;user-select:none;transition:transform .4s ease}
#whale:hover{transform:translateY(-3px);opacity:1}

/* ---------- 窗口 ---------- */
.win{position:absolute;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:200px;min-height:120px;
  opacity:0;transform:scale(.96) translateY(10px);pointer-events:none;transition:opacity .16s ease,transform .16s ease,box-shadow .15s ease}
.win.open{opacity:1;transform:none;pointer-events:auto}
.win.active{box-shadow:var(--shadow-active)}
.win.active .titlebar{background:var(--accent-soft);border-bottom-color:#e4cdb9}
.win.dragging,.win.resizing{transition:none}

.titlebar{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 11px;flex:none;
  background:var(--paper-2);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;cursor:default;user-select:none}
.win.active .titlebar .t-title{color:var(--ink)}
.t-title{font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-2);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  display:flex;align-items:center;gap:7px}
.t-ico{width:14px;height:14px;flex:none}
.t-actions{display:flex;gap:4px;align-items:center}
.t-btn{width:22px;height:22px;border:none;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .12s ease,color .12s ease}
.t-btn:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.t-btn.max:hover{background:var(--teal);color:#fff}
.t-btn.close:hover{background:#c65b4e;color:#fff}
.t-btn svg{width:12px;height:12px}

.win-body{flex:1;overflow:auto;padding:14px 16px;position:relative}
.win-body::selection,.win-body *::selection{background:#f3cfb4}

/* 缩放手柄 */
.rz{position:absolute;z-index:5}
.rz-e{right:-3px;top:24px;bottom:14px;width:7px;cursor:ew-resize}
.rz-s{bottom:-3px;left:14px;right:14px;height:7px;cursor:ns-resize}
.rz-se{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}
.rz-se::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;
  border-right:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);border-radius:1px}
.win:not(.resizable) .rz{display:none}

/* ---------- 窗口内容 ---------- */
/* 待办 */
.todo-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:7px 9px;border-radius:8px;transition:background .12s ease}
.todo-item:hover{background:var(--paper-2)}
.todo-item input[type=checkbox]{appearance:none;width:17px;height:17px;flex:none;margin-top:1px;border:1.5px solid var(--line-strong);
  border-radius:5px;cursor:pointer;position:relative;transition:all .15s ease;background:#fff}
.todo-item input[type=checkbox]:hover{border-color:var(--accent)}
.todo-item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.todo-item input[type=checkbox]:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.todo-item .txt{flex:1;line-height:1.5;cursor:text;outline:none;border-radius:4px;padding:0 2px}
.todo-item .txt:focus{background:#fff8f2;box-shadow:0 0 0 1.5px var(--accent)}
.todo-item.done .txt{color:var(--ink-2);text-decoration:line-through;text-decoration-color:#c3bcae}
.todo-foot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--ink-2);font-size:12px;font-family:var(--mono)}
.todo-add{width:100%;margin-top:8px;border:1px dashed var(--line-strong);background:transparent;border-radius:8px;
  padding:6px 10px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left;transition:all .12s ease}
.todo-add:hover{border-color:var(--accent);color:var(--accent)}

/* 便笺 */
.note-area{width:100%;height:100%;min-height:120px;border:none;background:transparent;resize:none;outline:none;
  font:inherit;font-size:15px;line-height:1.85;color:var(--ink);font-family:var(--font)}
.note-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:6px 16px 10px;border-top:1px dashed var(--line);flex:none}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.05em}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;
  color:var(--ink-2);font-size:14px;line-height:1;transition:all .12s ease;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-size:11.5px;color:var(--ink-2);padding:4px 0;font-family:var(--mono)}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:8px;
  font-family:var(--mono);color:var(--ink);cursor:default;transition:background .1s ease}
.cal-d:hover{background:var(--paper-2)}
.cal-d.dim{color:#c6c0b4}
.cal-d.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(217,111,50,.35)}
.cal-d.other-month:hover{background:transparent}
.cal-foot{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-2);font-family:var(--mono)}

/* 项目 */
.proj-card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;transition:box-shadow .15s ease,border-color .15s ease}
.proj-card:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(40,35,25,.08)}
.proj-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.proj-ico{width:38px;height:38px;border-radius:9px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.proj-ico svg{width:20px;height:20px}
.proj-name{font-weight:700;font-size:15.5px}
.proj-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e3efe9;color:var(--teal);margin-left:8px;vertical-align:2px;font-family:var(--mono)}
.proj-desc{color:var(--ink-2);line-height:1.7;font-size:13.5px;margin-bottom:14px}
.proj-actions{display:flex;gap:8px}
.btn{border:none;border-radius:8px;padding:7px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s ease}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#c4612a}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink-2);color:var(--ink)}
.proj-more{margin-top:14px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.proj-more .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}

/* 天气 */
.wx-now{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.wx-ico{width:40px;height:40px;flex:none;color:#e0a13c}
.wx-temp{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-.02em}
.wx-cond{font-size:13px;color:var(--ink-2);margin-top:1px}
.wx-rows{width:100%;border-collapse:collapse;font-size:12.5px}
.wx-rows td{padding:4.5px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.wx-rows td:last-child{text-align:right;color:var(--ink);font-family:var(--mono)}
.wx-rows tr:last-child td{border-bottom:none}
.wx-demo{margin-top:8px;font-size:10.5px;color:#b3ada0;text-align:right;font-family:var(--mono)}

/* 设置 */
.set-sec{margin-bottom:18px}
.set-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-2);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.set-label .t-ico{width:13px;height:13px}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-item{aspect-ratio:16/10;border-radius:8px;border:2px solid var(--line);cursor:pointer;position:relative;
  background-size:cover;background-position:center;transition:all .12s ease;overflow:hidden}
.wp-item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.wp-item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wp-item .wp-name{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;background:rgba(0,0,0,.4);
  padding:2px 5px;text-align:center;letter-spacing:.05em}
.wp-item.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--paper-2);color:var(--ink-2);font-size:11px;border-style:dashed}
.wp-item.upload:hover{color:var(--accent);border-color:var(--accent)}
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.set-row label{flex:none;width:58px}
input[type=range]{flex:1;accent-color:var(--accent);height:4px}
select{border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.set-actions{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.reset-layout{margin-top:12px;font-size:12.5px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 18px);transform:translateX(-50%) translateY(8px);
  background:rgba(44,42,38,.92);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;
  pointer-events:none;transition:all .22s ease;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 应用栏 ---------- */
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:calc(var(--dock-h) - 28px);
  display:flex;align-items:center;gap:4px;padding:6px 10px;background:rgba(38,36,32,.88);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:9000}
.dock-sep{width:1px;height:36px;background:rgba(255,255,255,.18);margin:0 6px;flex:none}
.dock-btn{width:58px;border:none;background:transparent;border-radius:11px;padding:6px 2px 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:background .12s ease,transform .12s ease}
.dock-btn:hover{background:rgba(255,255,255,.1)}
.dock-btn:active{transform:scale(.94)}
.dock-btn svg{width:21px;height:21px;color:#d9d4c9;transition:color .12s ease,transform .15s ease}
.dock-btn:hover svg{transform:translateY(-1px)}
.dock-btn span{font-size:10.5px;color:#b9b3a7;letter-spacing:.03em;transition:color .12s ease}
/* 已打开 */
.dock-btn.opened svg{color:#fff}
.dock-btn.opened span{color:#e8e3d8}
.dock-btn.opened::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.45)}
/* 当前活动 */
.dock-btn.active{background:rgba(255,255,255,.14)}
.dock-btn.active svg{color:var(--accent)}
.dock-btn.active span{color:#fff;font-weight:600}
.dock-btn.active::after{background:var(--accent);width:14px;border-radius:2px}

/* 窄屏适配 */
@media (max-width:760px){
  #dock{gap:0;padding:4px 4px}
  .dock-btn{width:46px}
  .dock-btn span{font-size:9.5px}
  #corner-clock .time{font-size:22px}
}
</style>
</head>
<body>

<div id="wallpaper"></div>
<div id="wallpaper-tint"></div>

<div id="corner-clock">
  <div class="date" id="cc-date"></div>
  <div class="time" id="cc-time">--:--</div>
  <div class="lunar" id="cc-lunar"></div>
</div>

<svg id="whale" width="34" height="22" viewBox="0 0 17 11">
  <g fill="#4a7fc9">
    <rect x="2" y="3" width="10" height="5"/>
    <rect x="12" y="4" width="2" height="4"/>
    <rect x="14" y="5" width="1" height="2"/>
    <rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="8" height="1"/>
    <rect x="1" y="8" width="1" height="1"/><rect x="2" y="8" width="8" height="1"/>
    <rect x="4" y="1" width="2" height="1"/>
  </g>
  <rect x="4" y="4" width="1" height="1" fill="#fff"/>
  <g fill="#3a66a3"><rect x="3" y="9" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/></g>
</svg>

<div id="desktop"></div>

<div id="dock"></div>
<div id="toast"></div>

<script>
/* ================= 数据与常量 ================= */
const STORE_KEY = 'workbench.v1';
const DOCK_H = 76, MARGIN = 12, SNAP = 14;

const WALLPAPERS = [
  { id:'dusk',   name:'暮色海面', css:'radial-gradient(120% 90% at 70% 110%, #f4c58f 0%, rgba(244,197,143,0) 55%), linear-gradient(180deg, #40607e 0%, #5d7d94 45%, #93a5ab 80%, #c9b8a4 100%)' },
  { id:'mist',   name:'清晨薄雾', css:'linear-gradient(180deg, #dfe6e4 0%, #e9e9e2 50%, #f0e8dc 100%), radial-gradient(80% 60% at 30% 20%, rgba(255,255,255,.5), transparent)' },
  { id:'dune',   name:'午后沙丘', css:'linear-gradient(180deg, #ead9bd 0%, #e2c9a4 60%, #d9b990 100%), radial-gradient(60% 40% at 75% 25%, rgba(255,244,220,.55), transparent)' },
  { id:'night',  name:'夜幕',     css:'linear-gradient(180deg, #1d2733 0%, #2c3a48 60%, #3d4d59 100%), radial-gradient(50% 35% at 80% 15%, rgba(148,175,199,.25), transparent)' },
  { id:'c-paper',name:'纸白',     css:'#f0ede6' },
  { id:'c-grey', name:'浅灰',     css:'#dfdcd6' },
  { id:'c-blue', name:'雾蓝',     css:'#c3d2d8' },
  { id:'c-green',name:'墨绿',     css:'#39504b' },
];

const ICONS = {
  todo:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
  note:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-4 4H4z"/><path d="M16 21v-4h4"/><path d="M8 9h8M8 13h5"/></svg>',
  cal:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>',
  proj:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/></svg>',
  weather:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  set:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  album:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4-9 9"/></svg>',
  img:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>',
};

/* 窗口定义：pos 为相对视口的分数，保证 1366/1440/1920 均衡 */
const WIN_DEFS = {
  todo: {
    title:'待办', icon:ICONS.todo, dockLabel:'待办', dockIcon:ICONS.todo,
    resizable:true, maximizable:false,
    def:{ w:318, h:330, fx:.075, fy:.12 }, defOpen:true,
  },
  note: {
    title:'便笺', icon:ICONS.note, dockLabel:'便笺', dockIcon:ICONS.note,
    resizable:true, maximizable:false,
    def:{ w:372, h:318, fx:.555, fy:.21 }, defOpen:true,
  },
  calendar: {
    title:'日历', icon:ICONS.cal, dockLabel:'日历', dockIcon:ICONS.cal,
    resizable:true, maximizable:true,
    def:{ w:330, h:400, fx:.30, fy:.42 }, defOpen:false,
  },
  projects: {
    title:'项目', icon:ICONS.proj, dockLabel:'项目', dockIcon:ICONS.proj,
    resizable:true, maximizable:true,
    def:{ w:400, h:312, fx:.62, fy:.44 }, defOpen:false,
  },
  weather: {
    title:'天气', icon:ICONS.weather, dockLabel:null, dockIcon:null, inDock:false,
    resizable:false, maximizable:false,
    def:{ w:236, h:252, fx:null, fy:null, ax:'right', ay:'top', ox:20, oy:20 }, defOpen:true,
  },
  settings: {
    title:'外观设置', icon:ICONS.set, dockLabel:'外观设置', dockIcon:ICONS.set,
    resizable:false, maximizable:false,
    def:{ w:432, h:486, fx:.5, fy:.5, center:true }, defOpen:false,
  },
};
const DOCK_ORDER = ['projects','todo','note','calendar','|','settings'];

/* ================= 状态 ================= */
let S = null; // {windows:{id:{x,y,w,h,open,maximized,restore}}, content:{todos,note,calY,calM}, appearance:{...}}

function defaultLayout(){
  const vw = innerWidth, vh = innerHeight;
  const wins = {};
  for (const [id, def] of Object.entries(WIN_DEFS)){
    const d = def.def;
    let x, y;
    if (d.center){ x = vw/2 - d.w/2; y = vh/2 - d.h/2; }
    else if (d.ax === 'right'){ x = vw - d.w - d.ox; y = d.oy; }
    else { x = vw * d.fx; y = vh * d.fy; }
    wins[id] = { x:Math.round(x), y:Math.round(y), w:d.w, h:d.h, open:def.defOpen, maximized:false, restore:null };
  }
  return wins;
}

function defaultContent(){
  const now = new Date();
  return {
    todos:[
      { txt:'把相册的导出功能写完', done:false },
      { txt:'下午四点和阿哲过一下原型', done:false },
      { txt:'去楼下取寄存的绿植', done:true },
    ],
    note:'周记：\n这周主要在整理照片的元数据，比想象中费劲，但跑通之后确实顺畅不少。\n\n- 想给工作台加一个快捷截图入口\n- 绿植放窗边好像活过来了\n- 记得试试新的手冲豆子',
    calY: now.getFullYear(), calM: now.getMonth(),
  };
}

const defaultAppearance = { wp:'dusk', fit:'cover', bright:0, custom:null };

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      // 确保所有窗口都存在
      const wins = defaultLayout();
      for (const id in wins) if (s.windows?.[id]) Object.assign(wins[id], s.windows[id]);
      return { windows:wins, content:{...defaultContent(), ...s.content}, appearance:{...defaultAppearance, ...s.appearance} };
    }
  }catch(e){}
  return { windows:defaultLayout(), content:defaultContent(), appearance:{...defaultAppearance} };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const desktop = $('#desktop');
let zTop = 100, activeId = null;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function clampWin(id, st){
  const vw = innerWidth, vh = innerHeight;
  const maxB = vh - DOCK_H - 6;           // 不能遮住应用栏
  st.w = Math.min(st.w, vw - 2*MARGIN);
  st.h = Math.min(st.h, maxB - MARGIN);
  st.x = Math.max(MARGIN - st.w + 80, Math.min(st.x, vw - MARGIN - 80)); // 至少留 80px 可见
  st.y = Math.max(0, Math.min(st.y, maxB - 40));
}

/* ================= 窗口构建 ================= */
const winEls = {};

function buildWindows(){
  for (const [id, def] of Object.entries(WIN_DEFS)){
    const el = document.createElement('div');
    el.className = 'win' + (def.resizable ? ' resizable' : '');
    el.dataset.id = id;
    el.innerHTML = `
      <div class="titlebar">
        <div class="t-title"><span class="t-ico">${def.icon}</span>${def.title}</div>
        <div class="t-actions">
          ${def.maximizable ? '<button class="t-btn max" title="最大化 / 还原"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>' : ''}
          <button class="t-btn close" title="收回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="rz rz-e"></div><div class="rz rz-s"></div><div class="rz rz-se"></div>`;
    desktop.appendChild(el);
    winEls[id] = el;
    bindWindow(id, el, def);
    renderBody(id);
    if (def.dockLabel === null && !def.inDock){} // 天气仅通过角标？不，天气默认展开但不在应用栏
  }
}

function applyWinPos(id){
  const st = S.windows[id], el = winEls[id];
  el.style.left = st.x+'px'; el.style.top = st.y+'px';
  el.style.width = st.w+'px'; el.style.height = st.h+'px';
}

function syncWin(id){
  const st = S.windows[id], el = winEls[id];
  el.classList.toggle('open', st.open);
  applyWinPos(id);
}

function focusWin(id){
  if (activeId === id) { winEls[id].style.zIndex = ++zTop; return; }
  activeId = id;
  for (const [wid, el] of Object.entries(winEls)){
    el.classList.toggle('active', wid === id && S.windows[wid].open);
    if (wid === id) el.style.zIndex = ++zTop;
  }
  syncDock();
}

function toggleWin(id, forceOpen){
  const st = S.windows[id];
  const def = WIN_DEFS[id];
  if (!st.open){
    if (def.maximizable && st.maximized) applyMax(id, true);
    st.open = true;
    focusWin(id);
  } else if (activeId === id && !forceOpen){
    st.open = false;                 // 收回：保留内容/位置/大小
    if (def.maximizable) applyMax(id, false, true);
    activeId = null;
    // 焦点交给最上层剩余窗口
    let best = null, bz = -1;
    for (const [wid, w] of Object.entries(S.windows))
      if (w.open && +winEls[wid].style.zIndex > bz){ bz = +winEls[wid].style.zIndex; best = wid; }
    if (best) focusWin(best); else syncDock();
  } else {
    focusWin(id);                    // 被遮挡：置顶
  }
  syncWin(id); syncDock(); saveState();
}

function applyMax(id, on, silent){
  const st = S.windows[id], el = winEls[id];
  if (on){
    if (!st.maximized){
      st.restore = { x:st.x, y:st.y, w:st.w, h:st.h };
      st.maximized = true;
    }
    st.x = MARGIN; st.y = MARGIN;
    st.w = innerWidth - 2*MARGIN;
    st.h = innerHeight - DOCK_H - MARGIN - 6;
  } else {
    if (st.maximized && st.restore){
      Object.assign(st, st.restore); st.maximized = false; st.restore = null;
    } else st.maximized = false;
  }
  if (!silent) applyWinPos(id);
}

/* ================= 窗口交互（拖动/缩放/吸附） ================= */
function bindWindow(id, el, def){
  const bar = el.querySelector('.titlebar');

  el.addEventListener('pointerdown', ()=>{ if (S.windows[id].open) focusWin(id); }, true);

  // 拖动
  bar.addEventListener('pointerdown', e=>{
    if (e.target.closest('.t-btn') || !S.windows[id].open) return;
    const st = S.windows[id];
    if (st.maximized) return;
    const sx = e.clientX, sy = e.clientY, ox = st.x, oy = st.y;
    el.classList.add('dragging');
    bar.setPointerCapture(e.pointerId);
    let moved = false;
    const mv = ev=>{
      let nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
      moved = true;
      // 边缘吸附
      const vw = innerWidth, maxB = innerHeight - DOCK_H - 6;
      if (Math.abs(nx - MARGIN) < SNAP) nx = MARGIN;
      if (Math.abs(nx + st.w - (vw - MARGIN)) < SNAP) nx = vw - MARGIN - st.w;
      if (Math.abs(ny - MARGIN) < SNAP) ny = MARGIN;
      if (Math.abs(ny + st.h - maxB) < SNAP) ny = maxB - st.h;
      st.x = nx; st.y = ny;
      clampWin(id, st);
      applyWinPos(id);
    };
    const up = ()=>{
      bar.removeEventListener('pointermove', mv);
      bar.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      if (moved) saveState();
    };
    bar.addEventListener('pointermove', mv);
    bar.addEventListener('pointerup', up);
  });

  // 双击标题栏最大化（仅大窗口）
  bar.addEventListener('dblclick', e=>{
    if (e.target.closest('.t-btn') || !def.maximizable) return;
    applyMax(id, !S.windows[id].maximized);
    saveState();
  });

  el.querySelector('.t-btn.close').addEventListener('click', e=>{
    e.stopPropagation();
    toggleWin(id);
  });
  const maxBtn = el.querySelector('.t-btn.max');
  if (maxBtn) maxBtn.addEventListener('click', e=>{
    e.stopPropagation();
    applyMax(id, !S.windows[id].maximized); saveState();
  });

  // 缩放：E / S / SE
  if (def.resizable){
    const minW = id==='calendar' ? 300 : id==='projects' ? 360 : 240;
    const minH = id==='calendar' ? 320 : 200;
    el.querySelectorAll('.rz').forEach(h=>{
      h.addEventListener('pointerdown', e=>{
        e.stopPropagation();
        const st = S.windows[id];
        if (st.maximized) return;
        const dir = h.classList.contains('rz-e') ? 'e' : h.classList.contains('rz-s') ? 's' : 'se';
        const sx = e.clientX, sy = e.clientY, ow = st.w, oh = st.h;
        el.classList.add('resizing');
        h.setPointerCapture(e.pointerId);
        const mv = ev=>{
          if (dir.includes('e')) st.w = Math.max(minW, Math.min(ow + ev.clientX - sx, innerWidth - 2*MARGIN));
          if (dir.includes('s')) st.h = Math.max(minH, Math.min(oh + ev.clientY - sy, innerHeight - DOCK_H - 6 - st.y));
          applyWinPos(id);
        };
        const up = ()=>{
          h.removeEventListener('pointermove', mv);
          h.removeEventListener('pointerup', up);
          el.classList.remove('resizing');
          saveState();
        };
        h.addEventListener('pointermove', mv);
        h.addEventListener('pointerup', up);
      });
    });
  }
}

/* ================= 各窗口内容 ================= */
function renderBody(id){
  const body = winEls[id].querySelector('.win-body');
  if (id === 'todo') renderTodo(body);
  else if (id === 'note') renderNote(body);
  else if (id === 'calendar') renderCal(body);
  else if (id === 'projects') renderProjects(body);
  else if (id === 'weather') renderWeather(body);
  else if (id === 'settings') renderSettings(body);
}

/* --- 待办 --- */
function renderTodo(body){
  body.innerHTML = '';
  const ul = document.createElement('ul'); ul.className = 'todo-list';
  S.content.todos.forEach((t, i)=>{
    const li = document.createElement('li'); li.className = 'todo-item' + (t.done ? ' done' : '');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
    cb.addEventListener('change', ()=>{ t.done = cb.checked; li.classList.toggle('done', t.done); saveState(); });
    const span = document.createElement('span'); span.className = 'txt'; span.textContent = t.txt;
    span.contentEditable = 'true'; span.spellcheck = false;
    span.addEventListener('blur', ()=>{ t.txt = span.textContent.trim() || t.txt; span.textContent = t.txt; saveState(); });
    span.addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); span.blur(); } });
    li.append(cb, span); ul.appendChild(li);
  });
  const left = S.content.todos.filter(t=>!t.done).length;
  const foot = document.createElement('div'); foot.className = 'todo-foot';
  foot.textContent = `${left} 项待完成 · 共 ${S.content.todos.length} 项`;
  const add = document.createElement('button'); add.className = 'todo-add'; add.textContent = '+ 添加一条…';
  add.addEventListener('click', ()=>{
    S.content.todos.push({ txt:'新任务（点击文字可编辑）', done:false }); saveState(); renderTodo(body);
  });
  body.append(ul, add, foot);
}

  ta.addEventListener('input', upd); upd();

/* --- 日历 --- */
function renderCal(body){
  const y = S.content.calY, m = S.content.calM;
  const now = new Date();
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7; // 周一开头
  const days = new Date(y, m+1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
  let html = `<div class="cal-head">
      <div class="cal-title">${y} 年 ${m+1} 月</div>
      <div class="cal-nav"><button data-d="-1" title="上个月">‹</button><button data-t="1" title="回到本月">·</button><button data-d="1" title="下个月">›</button></div>
    </div><div class="cal-grid">`;
  for (const wd of ['一','二','三','四','五','六','日']) html += `<div class="cal-wd">${wd}</div>`;
  for (let i = start - 1; i >= 0; i--) html += `<div class="cal-d dim other-month">${prevDays - i}</div>`;
  for (let d = 1; d <= days; d++){
    const isToday = y === now.getFullYear() && m === now.getMonth() && d === now.getDate();
    html += `<div class="cal-d${isToday ? ' today' : ''}">${d}</div>`;
  }
  const tail = (7 - (start + days) % 7) % 7;
  for (let i = 1; i <= tail; i++) html += `<div class="cal-d dim other-month">${i}</div>`;
  const wd = '日一二三四五六'[new Date(y, m, now.getDate()).getDay()];
  html += `</div><div class="cal-foot">今天是 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 周${wd}</div>`;
  body.innerHTML = html;
  body.querySelectorAll('.cal-nav button').forEach(b=>{
    b.addEventListener('click', ()=>{
      if (b.dataset.t){ const n = new Date(); S.content.calY = n.getFullYear(); S.content.calM = n.getMonth(); }
      else {
        let mm = S.content.calM + (+b.dataset.d);
        S.content.calY += Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12; S.content.calM = mm;
      }
      saveState(); renderCal(body);
    });
  });
}

/* --- 设置 --- */
let setSel = null; // 预览选择
function renderSettings(body){
  body.innerHTML = `
    <div class="set-sec">
      <div class="set-label"><span class="t-ico">${ICONS.img}</span>桌面背景</div>
      <div class="wp-grid" id="wp-grid"></div>
    </div>
    <div class="set-sec">
      <div class="set-label"><span class="t-ico">${ICONS.set}</span>显示调节</div>
      <div class="set-row"><label>明暗</label><input type="range" id="wp-bright" min="-40" max="40" step="5"><span id="wp-bright-v" style="font-family:var(--mono);font-size:12px;width:34px;text-align:right"></span></div>
      <div class="set-row"><label>填充方式</label><select id="wp-fit"><option value="cover">等比填充（裁切）</option><option value="contain">完整显示（留边）</option></select></div>
    </div>
    <div class="set-actions">
      <button class="btn btn-primary" id="wp-apply">应用</button>
      <button class="btn btn-ghost" id="wp-reset">恢复默认背景</button>
    </div>
    <div class="reset-layout"><button class="btn btn-ghost" id="layout-reset" style="width:100%">恢复默认窗口布局</button></div>`;

  const grid = body.querySelector('#wp-grid');
  setSel = S.appearance.custom ? 'upload' : S.appearance.wp;

  const items = WALLPAPERS.map(wp=>{
    const d = document.createElement('div');
    d.className = 'wp-item'; d.style.background = wp.css; d.dataset.wp = wp.id;
    d.innerHTML = `<div class="wp-name">${wp.name}</div>`;
    d.addEventListener('click', ()=>{ setSel = wp.id; previewAppearance({ wp:wp.id, custom:null }); markSel(); });
    return d;
  });
  // 上传入口
  const up = document.createElement('div');
  up.className = 'wp-item upload'; up.dataset.wp = 'upload';
  up.innerHTML = `${ICONS.img}<span>上传图片</span>`;
  const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
  up.addEventListener('click', ()=>file.click());
  file.addEventListener('change', ()=>{
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        setSel = 'upload';
        previewAppearance({ custom:r.result });
        markSel(); toast('已预览，点击「应用」保存');
      }catch(e){ toast('图片过大，无法保存到本地'); }
    };
    r.readAsDataURL(f);
  });
  up.appendChild(file);
  grid.append(...items, up);

  function markSel(){
    grid.querySelectorAll('.wp-item').forEach(d=>d.classList.toggle('sel', d.dataset.wp === setSel));
  }
  markSel();

  const bright = body.querySelector('#wp-bright'), bv = body.querySelector('#wp-bright-v');
  bright.value = S.appearance.bright;
  const updBv = ()=> bv.textContent = (S.appearance.bright > 0 ? '+' : '') + S.appearance.bright;
  updBv();
  bright.addEventListener('input', ()=>{ S.appearance.bright = +bright.value; updBv(); applyAppearance(); saveState(); });

  const fit = body.querySelector('#wp-fit');
  fit.value = S.appearance.fit;
  fit.addEventListener('change', ()=>{ S.appearance.fit = fit.value; applyAppearance(); saveState(); });

  body.querySelector('#wp-apply').addEventListener('click', ()=>{
    if (setSel === 'upload'){ if (!S.appearance.custom){ toast('请先选择一张图片'); return; } }
    else if (setSel){ S.appearance.wp = setSel; S.appearance.custom = null; }
    applyAppearance(); saveState(); toast('外观已保存');
  });
  body.querySelector('#wp-reset').addEventListener('click', ()=>{
    S.appearance = { ...defaultAppearance }; setSel = 'dusk';
    bright.value = 0; fit.value = 'cover'; updBv();
    markSel(); applyAppearance(); saveState(); toast('已恢复默认背景');
  });
  body.querySelector('#layout-reset').addEventListener('click', ()=>{
    const keepOpen = {}; for (const id in S.windows) keepOpen[id] = S.windows[id].open;
    S.windows = defaultLayout();
    for (const id in S.windows){ syncWin(id); winEls[id].style.zIndex = ++zTop; }
    // 恢复后默认只开待办与便笺（内容保留）
    for (const id in S.windows) if (id !== 'todo' && id !== 'note' && id !== 'weather') S.windows[id].open = false;
    for (const id in S.windows) syncWin(id);
    activeId = null; focusWin('todo');
    saveState(); toast('已恢复默认窗口布局');
  });
}

/* 外观预览（未保存时立即生效到画面） */
function previewAppearance(patch){
  const a = { ...S.appearance, ...patch };
  S.appearance = a; applyAppearance(); // 预览即所见
}

function applyAppearance(){
  const a = S.appearance, wp = $('#wallpaper');
  if (a.custom){ wp.style.background = `url(${a.custom}) center/${a.fit === 'contain' ? 'contain' : 'cover'} no-repeat`; }
  else {
    const w = WALLPAPERS.find(x=>x.id === a.wp) || WALLPAPERS[0];
    if (w.css.startsWith('#')){ wp.style.background = w.css; }
    else wp.style.background = w.css.replace(/;$/, '') + '; background-size:cover; background-position:center';
  }
  wp.style.backgroundSize = a.fit === 'contain' ? 'contain' : 'cover';
  const tint = $('#wallpaper-tint');
  if (a.bright > 0) tint.style.background = `rgba(255,250,240,${a.bright/100})`;
  else if (a.bright < 0) tint.style.background = `rgba(15,18,24,${-a.bright/100})`;
  else tint.style.background = 'transparent';
}

/* ================= 应用栏 ================= */
function buildDock(){
  const dock = $('#dock');
  for (const item of DOCK_ORDER){
    if (item === '|'){ const s = document.createElement('div'); s.className = 'dock-sep'; dock.appendChild(s); continue; }
    const def = WIN_DEFS[item];
    const b = document.createElement('button');
    b.className = 'dock-btn'; b.dataset.app = item;
    b.innerHTML = `${def.dockIcon}<span>${def.dockLabel}</span>`;
    b.title = def.dockLabel;
    b.addEventListener('click', ()=>toggleWin(item));
    dock.appendChild(b);
  }
  syncDock();
}
function syncDock(){
  document.querySelectorAll('.dock-btn').forEach(b=>{
    const id = b.dataset.app, st = S.windows[id];
    b.classList.toggle('opened', st.open);
    b.classList.toggle('active', st.open && activeId === id);
  });
}

/* ================= 时钟 ================= */
const WEEKS = ['日','一','二','三','四','五','六'];
function tick(){
  const n = new Date();
  $('#cc-date').textContent = `${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} 周${WEEKS[n.getDay()]}`;
  $('#cc-time').textContent = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
setInterval(tick, 1000); tick();

/* ================= 视口变化 ================= */
let rzTm = null;
addEventListener('resize', ()=>{
  for (const [id, st] of Object.entries(S.windows)){
    if (st.maximized){ applyMax(id, true, true); }
    clampWin(id, st);
    applyWinPos(id);
  }
  clearTimeout(rzTm); rzTm = setTimeout(saveState, 300);
});

/* ================= 启动 ================= */
S = loadState();
buildWindows();
buildDock();
applyAppearance();

// 初始 z 序与焦点
let firstZ = null;
for (const [id, st] of Object.entries(S.windows)){
  if (st.open){ winEls[id].style.zIndex = ++zTop; if (id === 'todo') firstZ = id; }
}
for (const id in S.windows) syncWin(id);
if (S.windows.todo.open) focusWin('todo');
else { let best=null,bz=-1; for (const [id,st] of Object.entries(S.windows)) if (st.open && +winEls[id].style.zIndex>bz){bz=+winEls[id].style.zIndex;best=id;} if(best) focusWin(best); }
syncDock();
</script>
</body>
</html>
